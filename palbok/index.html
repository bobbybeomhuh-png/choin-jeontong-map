.punch{animation:punch .5s ease-out}@keyframes punch{0%{transform:scale(1)}40%{transform:scale(.96) rotate(-1.5deg)}100%{transform:scale(1)}}

 q.font='26px "Gowun Dodum",sans-serif';q.fillStyle='#3b2a1c';[['장소','전주 팔복예술공장 이팝나무홀 D-CUBE'],['형식','실감미디어 · 4면 LED · 약 7분'],['좌석','방석 자유석'],['날짜',t.date]].forEach(([a,b],i)=>{q.fillStyle='#8b6b45';q.fillText(a,282,262+i*38);q.fillStyle='#1c130d';q.fillText(b,350,262+i*38)});
 q.fillStyle='#1c130d';q.font='700 24px "Noto Serif KR",serif';q.fillText('관람번호',790,70);q.font='44px "Do Hyeon",sans-serif';q.fillText('No.'+t.no,790,126);
