:root{--ink:#0d0806;--glass:rgba(22,15,10,.66);--paper:#f6e9d2;--muted:#c9b596;--gold:#e8b957;--gold-hi:#ffe19a;--holo:#8fe6d8;--display:"Gowun Batang","Nanum Myeongjo",serif;--body:"Gowun Dodum","Malgun Gothic",sans-serif;color-scheme:dark}

  <h2>백제 금동대향로, 복원 완료</h2>
  <p>1993년 부여 능산리 절터에서 나온 국보입니다. 봉황과 용, 다섯 연주자가 한 몸에 있어요. 녹슨 모습과 미래 장비는 이야기를 위한 연출입니다.</p>
  <div class="row"><small style="flex:1;min-width:120px">향로 사진 Gary Todd(CC0) · 소품 Poly Haven(CC0)</small><button class="btn ghost" id="stay" type="button">계속 쉬기</button><button class="btn" id="again" type="button">다시 복원</button></div>

<div id="gate"><div>
  <h1>무이 복원 공방</h1>
  <p>말없이 불 앞에 앉아 쉬어 가는 곳입니다.<br>소리를 켜고 들어와 주세요.</p>
  <button id="enter" type="button" disabled>공방 불 지피는 중</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(async function(){
const T=THREE,$=s=>document.querySelector(s),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches,touch=matchMedia('(pointer:coarse)').matches;
if(touch){document.body.classList.add('touch');$('#joy').hidden=false}
const say=$('#say');let sayT=0;function tell(html,sec=6){say.innerHTML=html;say.hidden=false;sayT=sec}
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ang2=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const enterBtn=$('#enter');const progress=m=>{enterBtn.textContent=m};

/* ---------- 렌더러 ---------- */
const canvas=$('#c');let R;
try{R=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){progress('이 기기에서는 3D 화면을 열 수 없습니다');return}
R.setPixelRatio(Math.min(devicePixelRatio,1.75));R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.0;R.shadowMap.enabled=false;
const scene=new T.Scene();scene.background=new T.Color(0x05070c);scene.fog=new T.FogExp2(0x0b0c12,.012);
let fp=false;const cam=new T.PerspectiveCamera(56,1,.08,240);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?(fp?84:72):(fp?70:54);cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const loadTex=(u,srgb=true)=>new Promise((res,rej)=>new T.TextureLoader().load(u,t=>{if(srgb)t.colorSpace=T.SRGBColorSpace;t.anisotropy=Math.min(8,R.capabilities.getMaxAnisotropy());res(t)},undefined,rej));
const unb=(b,C)=>{const q=atob(b),u=new Uint8Array(q.length);for(let i=0;i<q.length;i++)u[i]=q.charCodeAt(i);return new C(u.buffer)};
const getJ=u=>fetch(u).then(r=>r.json());
const layout=await getJ('assets/world/layout.json');const META=await getJ('assets/world/meta.json');

/* ---------- 빛을 구운 건물과 소품 ---------- */
progress('공방 짓는 중');
const RANGE=META.range;
const lmShell=await loadTex('assets/world/lm_shell.webp');lmShell.channel=1;lmShell.flipY=true;
const lmProp=await loadTex('assets/world/lm_prop.webp');
const NORMAL={floor:1,brick:1,stone:1,beam:1,plank:1};
await Promise.all(META.mats.map(async nm=>{const d=await getJ(`assets/world/geo_${nm}.json`);const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(unb(d.pos,Float32Array),3));g.setAttribute('normal',new T.BufferAttribute(unb(d.nor,Float32Array),3));g.setAttribute('uv',new T.BufferAttribute(unb(d.uv,Float32Array),2));g.setAttribute('uv1',new T.BufferAttribute(unb(d.uv2,Float32Array),2));g.setIndex(new T.BufferAttribute(unb(d.idx,Uint32Array),1));
 const map=await loadTex(`assets/world/tex/${nm}_d.webp`);map.wrapS=map.wrapT=T.RepeatWrapping;const o={map,lightMap:lmShell,lightMapIntensity:RANGE,roughness:nm==='floor'?.62:.86,metalness:0,side:T.DoubleSide};
 if(NORMAL[nm]&&META.normals.includes(nm)){const nt=await loadTex(`assets/world/tex/${nm}_n.webp`,false);nt.wrapS=nt.wrapT=T.RepeatWrapping;o.normalMap=nt;o.normalScale=new T.Vector2(.8,.8)}
 const me=new T.Mesh(g,new T.MeshStandardMaterial(o));if(nm==='floor'||nm==='ground')me.name='walk';scene.add(me)}));
{const d=await getJ('assets/world/geo_prop.json');const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(unb(d.pos,Float32Array),3));g.setAttribute('uv',new T.BufferAttribute(unb(d.uv2,Float32Array),2));g.setIndex(new T.BufferAttribute(unb(d.idx,Uint32Array),1));const c=new T.Color(RANGE,RANGE,RANGE);scene.add(new T.Mesh(g,new T.MeshBasicMaterial({map:lmProp,color:c.multiplyScalar(1.5)})))}
const skyT=await loadTex('assets/world/sky.webp');{const m=new T.Mesh(new T.SphereGeometry(200,48,24),new T.MeshBasicMaterial({map:skyT,side:T.BackSide,fog:false,toneMapped:false,color:0x4d5a78}));m.position.y=-4;scene.add(m)}

/* 동적 빛: 구운 빛 위로 일렁임만 더한다 */
scene.add(new T.HemisphereLight(0xcfd6ee,0x3a2717,.85));
const moonL=new T.DirectionalLight(0xbcd0ff,.55);moonL.position.set(6,10,12);scene.add(moonL);
const canvasTex=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t};
const softT=canvasTex(128,128,g=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128)});
const halo=(x,y,z,s,col,op)=>{const m=new T.SpriteMaterial({map:softT,color:col,transparent:true,opacity:op,blending:T.AdditiveBlending,depthWrite:false,fog:false,toneMapped:false}),o=new T.Sprite(m);o.position.set(x,y,z);o.scale.set(s,s,1);scene.add(o);return o};
/* 달: 원과 부드러운 달무리만 */
{const dir=new T.Vector3(.45,.62,1).normalize().multiplyScalar(170);const moonT=canvasTex(256,256,g=>{g.fillStyle='#000';g.clearRect(0,0,256,256);const r=g.createRadialGradient(118,118,10,128,128,120);r.addColorStop(0,'#fffbe9');r.addColorStop(.85,'#f2ecd0');r.addColorStop(1,'#e4dcbc');g.fillStyle=r;g.beginPath();g.arc(128,128,118,0,7);g.fill();g.fillStyle='rgba(150,150,140,.22)';for(let i=0;i<14;i++){g.beginPath();g.arc(rnd(40,216),rnd(40,216),rnd(8,30),0,7);g.fill()}});const mo=new T.Sprite(new T.SpriteMaterial({map:moonT,transparent:true,fog:false,toneMapped:false,depthWrite:false}));mo.position.copy(dir);mo.scale.set(11,11,1);scene.add(mo);const h=halo(dir.x,dir.y,dir.z,46,0xaebcdc,.28)}
const flames=[],fireLights={};
const fireFS=`uniform float t,seed,boost;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p=p*2.03+7.1;a*=.5;}return s;}
void main(){vec2 u=vUv;float x=(u.x-.5)*2.;float y=u.y;vec2 q=vec2(x*1.5+seed,y*1.8-t*1.05);float d=fbm(q+fbm(q*1.6+t*.22)*.75);float width=(1.-y*.85)*(1.+boost*.35);float body=smoothstep(width,width*.2,abs(x)+(d-.5)*.85*(.25+y));float f=body*smoothstep(1.,.05,y+(d-.45)*.75-boost*.15)*smoothstep(0.,.05,y)*smoothstep(1.,.78,y)*smoothstep(1.,.8,abs(x));vec3 c=mix(vec3(.85,.14,.02),vec3(1.,.5,.08),smoothstep(.1,.5,f));c=mix(c,vec3(1.,.88,.5),smoothstep(.55,.95,f));gl_FragColor=vec4(c*(1.2+boost*.5),clamp(f*1.4,0.,1.));}`;
function flame(x,y,z,w,h,seed,group){const u={t:{value:0},seed:{value:seed},boost:{value:0}},m=new T.ShaderMaterial({vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:fireFS,uniforms:u,transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,fog:false,toneMapped:false}),o=new T.Mesh(new T.PlaneGeometry(w,h),m);o.position.set(x,y+h/2,z);o.renderOrder=5;scene.add(o);flames.push({o,u,group});return o}
const FIRES={};for(const f of layout.fires){FIRES[f.id]=f;const n=f.id==='hearth'?3:2;for(let i=0;i<n;i++)flame(f.x+(i-(n-1)/2)*f.w*.24,f.id==='kiln'?.1:.12,f.z+(i%2)*.08,f.w*(i===1?.78:.62),f.h*(i===1?1:.84),i*3.1+f.x,f.id);const col=0xff8a3a,L=new T.PointLight(col,f.id==='hearth'?14:f.id==='pit'?11:6,f.id==='hearth'?14:11,1.7);L.position.set(f.x,f.id==='kiln'?.9:1.1,f.z+(f.id==='hearth'?1.2:0));scene.add(L);fireLights[f.id]=L;
