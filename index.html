<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
<style>
:root{
 --bg:#f3ece0;--panel:#fbf7ef;--land:#e6dac2;--line:#e2d8c4;--line2:#d6c9b0;
 --ink:#3b3326;--t2:#6f6553;--t3:#a39880;--teal:#1d8a6a;--gold:#a9803a;
 --sans:'Pretendard',-apple-system,system-ui,sans-serif;--serif:'Nanum Myeongjo',serif;
 --side-w:560px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;}
header{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;}
.title{font-family:var(--serif);font-size:20px;font-weight:800;letter-spacing:-.2px;}
.title small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--t3);letter-spacing:.2px;margin-top:1px;}
.spacer{margin-left:auto;}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 8px;color:var(--ink);font-size:13px;}
.brand .mark{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:12px;font-weight:800;}
.brand .logoimg{width:32px;height:32px;border-radius:0;object-fit:contain;margin:-3px 0;}
.homelogo{display:inline-flex;align-items:center;text-decoration:none;flex:0 0 auto;}
.homelogo img{width:46px;height:46px;object-fit:contain;}
.homelogo .mark{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;}
.inst{margin-top:6px;}
.inst .pill{display:inline-block;font-size:12px;background:var(--land);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;margin:3px 4px 3px 0;color:var(--ink);}
.inst .lock{display:block;margin-top:8px;text-decoration:none;font-size:13px;background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 14px;text-align:center;}
.contacts{margin-top:6px;}
.crow{padding:9px 11px;border:1px solid var(--line2);border-radius:10px;margin-bottom:7px;background:#fff;font-size:13px;}
.crow.hit{border-color:var(--teal);background:#f3faf6;}
.crow b{font-size:14px;}
.ctag{display:inline-block;font-size:10px;background:var(--land);border-radius:6px;padding:1px 6px;color:var(--t2);margin-left:5px;}
.cdept{color:var(--t3);font-size:12px;margin-left:5px;}
.ckw{color:#2c6b54;font-size:11px;margin-top:3px;}
.cmeta{font-size:12px;margin-top:4px;}
.cmeta a{color:var(--teal);text-decoration:none;}
.csrc{font-size:11px;color:var(--t3);margin-top:3px;}
.csrc a{color:var(--t3);}
.brand:hover{border-color:var(--ink);}
.chtabs{display:flex;gap:8px;margin-left:18px;}
.chtab{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:14px;font-weight:700;color:#fff;background:#c0392b;border-radius:999px;padding:7px 15px;box-shadow:0 1px 3px rgba(90,70,20,.18);transition:.15s;}
.chtab:hover{background:#a5301f;transform:translateY(-1px);}
.chface{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#f6efe2;margin-right:2px;box-shadow:0 0 0 1.5px rgba(255,255,255,.7);}
.chtab#tab-suksu{background:#a9803a;}
.chtab#tab-suksu:hover{background:#8f6a2c;}
@media(max-width:820px){.chtabs{display:none;}}
.board{height:calc(100% - 110px);overflow:auto;padding:26px 30px;}
.bwrap{max-width:1120px;margin:0 auto;}
.bhead h2{font-family:var(--serif);font-size:26px;font-weight:800;margin:0 0 4px;}
.bhead p{font-size:13px;color:var(--t2);margin:0 0 22px;}
.bregion{margin-bottom:26px;}
.bregtitle{font-family:var(--serif);font-size:18px;font-weight:800;margin:0 0 12px;cursor:pointer;display:inline-block;}
.bregtitle:hover{color:var(--gold);}
.bregtitle span{font-size:13px;color:var(--t3);font-weight:400;margin-left:4px;}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;font-size:12px;}
.lang button{border:0;background:transparent;color:var(--t2);padding:6px 12px;cursor:pointer;font-family:var(--sans);}
.lang button.on{background:var(--ink);color:var(--bg);}
.legend{display:flex;flex-wrap:wrap;gap:7px 12px;padding:9px 20px;font-size:11px;color:var(--t2);border-bottom:1px solid var(--line);}
.legend span{display:flex;align-items:center;gap:5px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.wrap{display:flex;height:calc(100% - 110px);}
#map{flex:1 1 auto;min-width:0;position:relative;background:var(--bg);}
#mapcard{position:absolute;left:16px;top:52px;width:238px;max-height:calc(100% - 78px);overflow:auto;background:rgba(251,247,239,.93);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid var(--line2);border-radius:15px;padding:15px 16px;box-shadow:0 5px 20px rgba(90,70,20,.13);z-index:2;}
.mc-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.mc-ava{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#f6efe2;box-shadow:0 1px 5px rgba(90,70,20,.2);}
.mc-title{font-family:var(--serif);font-size:16px;font-weight:800;line-height:1.2;color:var(--ink);}
.v-ava{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#f6efe2;vertical-align:middle;margin-right:8px;box-shadow:0 1px 3px rgba(90,70,20,.2);}
.mc-sub{font-size:11.5px;color:var(--t3);line-height:1.5;margin:4px 0 11px;}
.mc-stats{display:flex;gap:6px;margin-bottom:13px;}
.mc-stat{flex:1;background:var(--land);border-radius:9px;padding:8px 3px;text-align:center;}
.mc-stat b{display:block;font-size:17px;font-family:var(--serif);font-weight:800;color:var(--ink);line-height:1;}
.mc-stat span{font-size:10px;color:var(--t2);}
.mc-lab{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--gold);margin-bottom:8px;text-transform:uppercase;}
.mc-recent{display:flex;flex-direction:column;gap:6px;}
.mc-note{text-align:left;border:0;width:100%;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit;box-shadow:0 1px 2px rgba(90,70,20,.08);}
.mc-note:hover{background:#fffaf0;}
.mc-note .m{font-size:12px;color:#40381f;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mc-note .r{font-size:10.5px;color:var(--gold);font-weight:600;margin-top:3px;}
.mc-empty{font-size:11.5px;color:var(--t3);line-height:1.5;}
@media(max-width:900px){#mapcard{display:none;}}
.votebox{margin-top:18px;padding:15px 16px;border:1px solid #cfe0d6;border-radius:14px;background:#f3faf6;}
.votebox .vq{font-family:var(--serif);font-size:15px;font-weight:800;color:var(--ink);}
.votebox .vs{font-size:12.5px;color:var(--t2);line-height:1.55;margin:5px 0 12px;}
.vbtn{width:100%;border:0;border-radius:11px;padding:12px;background:var(--teal);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.vbtn:hover{background:#166b52;}
.vbtn.voted{background:#dfeee7;color:#2c6b54;cursor:default;}
.vbtn #vcount{font-weight:400;opacity:.9;font-size:13px;margin-left:4px;}
.subbox{margin-top:18px;padding:16px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,#fff8ec,#fbf3e3);}
.subbox .sq{font-family:var(--serif);font-size:15.5px;font-weight:800;color:var(--ink);}
.subbox .ss{font-size:12.5px;color:var(--t2);line-height:1.55;margin:5px 0 11px;}
.srow{display:flex;gap:7px;}
.srow input{flex:1;min-width:0;box-sizing:border-box;border:1px solid #e3d6bd;border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;background:#fff;}
.sbtn{white-space:nowrap;border:0;border-radius:9px;padding:10px 18px;background:var(--gold);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.sbtn:hover{background:#956f2f;}.sbtn:disabled{opacity:.6;cursor:default;}
.smsg{font-size:12px;margin-top:8px;min-height:1px;}
.smsg.ok{color:#2c6b54;}.smsg.err{color:#b5476f;}
.dbtn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:13.5px;font-weight:700;color:#fff;background:#5865F2;border-radius:10px;padding:11px;box-shadow:0 1px 3px rgba(60,60,120,.2);}
.dbtn:hover{background:#4752c4;}
.sor{text-align:center;font-size:11.5px;color:var(--t3);margin:10px 0 8px;}
.mc-disc{margin-top:12px;font-size:12.5px;padding:9px;}
#map svg{width:100%;height:100%;display:block;cursor:grab;}
#resizer{flex:0 0 7px;cursor:col-resize;background:var(--line);position:relative;}
#resizer::before{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:3px;height:34px;border-radius:3px;background:var(--line2);}
#resizer:hover{background:var(--gold);}
#side{flex:0 0 var(--side-w);width:var(--side-w);min-width:300px;border-left:1px solid var(--line);background:var(--panel);padding:22px 26px;overflow:auto;}
.cName{font-family:var(--serif);font-size:30px;font-weight:800;margin:0 0 2px;line-height:1.1;}
.cRegion{font-size:15px;color:var(--t3);margin-bottom:16px;}
.imgbox{width:100%;aspect-ratio:16/10;border-radius:12px;background:var(--land);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:12px;text-align:center;margin-bottom:18px;background-size:cover;background-position:center;}
.lab{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin:18px 0 5px;}
.concept{font-family:var(--serif);font-size:23px;line-height:1.55;color:var(--ink);}
.val{font-size:18px;line-height:1.65;color:var(--ink);}
.val.soon{color:var(--t3);font-size:14.5px;}
.exlist{margin-top:2px;}
.exrow{border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.exrow.r3{border-color:#c99a3a;background:#fffaf0;}
.exrow b{font-size:16.5px;font-family:var(--serif);}
.ext{display:inline-block;font-size:10px;background:var(--land);border-radius:6px;padding:1px 7px;color:var(--t2);margin-left:6px;vertical-align:2px;}
.exr{display:inline-block;font-size:10px;border-radius:6px;padding:1px 7px;margin-left:5px;vertical-align:2px;}
.exr.r1{background:#eee7d6;color:#8a7f68;}
.exr.r2{background:#e6f2eb;color:#2c6b54;}
.exr.r3{background:#f6e2b8;color:#8a5a12;font-weight:700;}
.exd{font-size:14px;color:var(--t2);margin-top:4px;line-height:1.55;}
.exmeta{margin-top:7px;border-top:1px dashed var(--line2);padding-top:7px;display:grid;gap:4px;}
.exmeta span{font-size:12px;color:var(--ink);line-height:1.45;}
.exmeta span i{font-style:normal;color:var(--t3);margin-right:5px;}
.exmore{font-size:12px;color:var(--teal);cursor:pointer;text-align:center;padding:4px;}
.rev{display:inline-block;font-size:10px;border-radius:6px;padding:1px 7px;margin-left:5px;vertical-align:2px;color:#fff;font-weight:600;}
.rev-발주{background:#b5476f;}.rev-공모{background:#2f6db5;}.rev-상설{background:#1d8a6a;}
.rev-굿즈{background:#c99a3a;}.rev-라이선싱{background:#7a5bb0;}.rev-채널{background:#8a7f68;}
.fit{display:inline-block;font-size:10px;border-radius:6px;padding:1px 7px;margin-left:5px;vertical-align:2px;background:#3b3326;color:#f3ece0;}
.reqbtn{display:inline-block;margin-top:9px;text-decoration:none;font-size:12px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:8px;padding:5px 11px;transition:.15s;}
.reqbtn:hover{background:var(--teal);color:#fff;}
.reqbtn.flag{display:block;margin-top:12px;text-align:center;background:var(--teal);color:#fff;font-size:13px;padding:11px;border:0;}
.reqbtn.flag:hover{background:#166b52;}
.flagvid{display:inline-block;font-size:11px;background:var(--teal);color:#fff;border-radius:6px;padding:2px 9px;margin-bottom:6px;}
.pitch{margin-top:24px;padding:18px;border:1px solid var(--line2);border-radius:14px;background:#fbf7ef;}
.pitch .ph{font-family:var(--serif);font-size:17px;font-weight:800;line-height:1.4;color:var(--ink);}
.pitch .ps{font-size:13px;color:var(--t2);margin:6px 0 14px;line-height:1.55;}
.pbtn{display:block;text-decoration:none;text-align:center;font-size:14px;padding:12px;border-radius:11px;margin-bottom:9px;border:1px solid var(--line2);color:var(--ink);}
.pbtn.main{background:var(--teal);color:#fff;font-weight:700;border:0;}
.pbtn.main:hover{background:#166b52;}
.pbtn:hover{border-color:var(--ink);}
.pmail{font-size:12.5px;color:var(--t2);margin-top:4px;text-align:center;}
.pmail a{color:var(--teal);text-decoration:none;}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px;}
.vcard{text-decoration:none;color:var(--ink);}
.vthumb{display:block;position:relative;aspect-ratio:16/10;border-radius:10px;background:var(--land) center/cover no-repeat;border:1px solid var(--line2);overflow:hidden;}
.vthumb .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(30,26,20,.18);opacity:.85;transition:.15s;}
.vcard:hover .vplay{background:rgba(30,26,20,.35);opacity:1;}
.vcard:hover .vthumb{border-color:var(--teal);}
.vtitle{display:block;font-size:12px;margin-top:4px;line-height:1.35;color:var(--t2);}
.rstat{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;}
.rstat.ok{background:#e6f2eb;color:#2c6b54;}
.rstat.wait{background:#f6e2b8;color:#8a5a12;}
.rlist{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.rcard{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);padding:6px;border:0.5px solid var(--line2);border-radius:10px;background:var(--panel);}
.rcard:hover{border-color:var(--teal);}
.rbefore,.rafter{flex:0 0 auto;width:76px;height:52px;border-radius:7px;background:var(--land) center/cover no-repeat;border:0.5px solid var(--line2);position:relative;}
.rafter .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;background:rgba(30,26,20,.22);border-radius:7px;}
.rarrow{flex:0 0 auto;color:var(--t3);font-size:14px;}
.rcard .vtitle{flex:1;margin-top:0;font-size:12.5px;color:var(--ink);}
.ba{position:relative;width:100%;max-width:480px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:.5px solid var(--line2);margin:0 auto 14px;box-shadow:0 2px 10px rgba(90,70,20,.14);user-select:none;touch-action:none;}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
.ba-after{z-index:1;}
.ba-before{z-index:2;clip-path:inset(0 50% 0 0);}
.ba-handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;z-index:3;box-shadow:0 0 5px rgba(0,0,0,.55);transform:translateX(-1px);pointer-events:none;}
.ba-handle::after{content:'⇄';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#333;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.4);}
.ba-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:4;}
.ba-tag{position:absolute;top:8px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#fff;background:rgba(20,16,12,.55);border-radius:6px;padding:3px 8px;z-index:3;pointer-events:none;}
.ba-tl{left:8px;}
.ba-tr{right:8px;background:#c0392b;text-decoration:none;pointer-events:auto;z-index:5;}
.ba-cap{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#fff;background:rgba(20,16,12,.5);border-radius:6px;padding:3px 10px;z-index:3;pointer-events:none;}
.vidgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.vcard2{text-decoration:none;color:var(--ink);display:block;}
.vthumb2{display:block;position:relative;aspect-ratio:16/9;border-radius:11px;background:var(--land) center/cover no-repeat;border:.5px solid var(--line2);overflow:hidden;box-shadow:0 1px 4px rgba(90,70,20,.10);}
.vthumb2 .vplay2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);background:rgba(20,16,12,.18);transition:.15s;}
.vcard2:hover .vplay2{background:rgba(196,40,40,.42);}
.vthumb2 .vbefore2{position:absolute;left:6px;bottom:6px;width:42px;height:28px;border-radius:5px;background:#000 center/cover no-repeat;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);}
.vthumb2 .vchip{position:absolute;right:6px;top:6px;font-size:10px;font-weight:700;color:#fff;background:rgba(20,16,12,.6);border-radius:5px;padding:1px 6px;}
.vt2{display:block;font-size:12.5px;line-height:1.35;margin-top:6px;color:var(--ink);}
.vchan{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:13.5px;font-weight:700;color:#fff;background:#c0392b;border-radius:10px;padding:11px;margin-bottom:6px;box-shadow:0 1px 3px rgba(90,70,20,.15);}
.vchan:hover{background:#a5301f;}
.notebtn{display:block;text-decoration:none;text-align:center;font-size:13px;padding:10px;border-radius:10px;background:#faeeda;color:#854f0b;border:0;}
.notebtn:hover{background:#f6e2b8;}
.wall{margin-top:2px;}
.wform{background:#fbf7ef;border:1px solid #ecdfc6;border-radius:10px;padding:10px;}
.wform textarea{width:100%;box-sizing:border-box;border:1px solid #e3d6bd;border-radius:7px;padding:8px;font:inherit;font-size:13px;line-height:1.45;resize:vertical;background:#fff;}
.wrow{display:flex;gap:8px;margin-top:8px;}
.wrow input{flex:1;min-width:0;box-sizing:border-box;border:1px solid #e3d6bd;border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;background:#fff;}
.wsend{white-space:nowrap;border:0;border-radius:7px;padding:7px 16px;background:#a9803a;color:#fff;font-weight:600;font-size:13px;cursor:pointer;}
.wsend:hover{background:#956f2f;}.wsend:disabled{opacity:.6;cursor:default;}
.wlist{display:flex;flex-wrap:wrap;align-items:flex-start;gap:11px 10px;margin-top:14px;padding-top:4px;}
.wnote{position:relative;border:1px solid;border-radius:8px;padding:13px 13px 9px;max-width:190px;min-width:96px;box-shadow:2px 3px 7px rgba(90,70,20,.16);transition:transform .13s,box-shadow .13s;}
.wnote:hover{transform:rotate(0deg) scale(1.05)!important;box-shadow:3px 5px 12px rgba(90,70,20,.24);z-index:3;}
.wpin{position:absolute;top:-5px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.35);background-image:radial-gradient(circle at 34% 30%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%);}
.wnote .wmsg{font-size:13px;line-height:1.45;color:#40381f;word-break:break-word;white-space:pre-wrap;}
.wnote .wmeta{font-size:11px;margin-top:6px;font-weight:600;opacity:.9;}
.wempty{font-size:12.5px;color:var(--t3);padding:6px 2px;}
.golist{display:flex;flex-direction:column;gap:5px;margin-bottom:6px;}
.gorow{display:flex;gap:8px;align-items:baseline;text-decoration:none;padding:7px 9px;border:1px solid var(--line2);border-radius:9px;background:#fff;}

.godd{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--t3);min-width:38px;}

.gok.k-지원사업{background:#e7eef6;color:#2f6db5;}
.gochips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.gochip{border:1px solid var(--line2);background:#fff;color:var(--t2);border-radius:999px;padding:6px 15px;font:inherit;font-size:12.5px;cursor:pointer;transition:.15s;}
.gochip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.gochip:hover{border-color:var(--ink);}
.gochips.ffilter{margin-top:6px;}
.gochip.fchip.on{background:var(--gold);color:#fff;border-color:var(--gold);}
.gof{display:inline-block;font-size:10px;border-radius:5px;padding:0 6px;vertical-align:1px;background:#eef2e8;color:#4a6b3f;margin-right:4px;}
.cta{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
.cta .h{font-family:var(--serif);font-size:14px;color:var(--t3);margin-bottom:10px;}
.cta a{display:block;text-decoration:none;padding:12px 16px;border-radius:11px;margin-bottom:9px;font-size:14px;}
.cta a.make{background:var(--teal);color:#fff;font-weight:600;}
.cta a.see{background:#2f2a20;color:#fff;}
.cta a.ai{background:transparent;border:1px solid var(--line2);color:var(--ink);}
.cta a small{display:block;font-size:11px;font-weight:400;opacity:.82;margin-top:1px;}
footer{padding:11px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--t3);display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
footer a{color:var(--t2);text-decoration:none;}
.clabel{font-size:10px;fill:var(--ink);font-family:var(--sans);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:2.5px;}
circle.city{cursor:pointer;}
.grid{display:none;flex-wrap:wrap;gap:14px;padding:16px 22px 50px;overflow:auto;align-content:flex-start;height:calc(100% - 110px);}
.ghdr{width:100%;font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink);margin:10px 0 2px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.gcard{width:172px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;transition:.15s;}

<script>
/* 서비스워커 완전 제거 + 캐시 정리 — 옛 캐시가 지도를 깨뜨리던 문제 근본해결.
   이미 SW가 박힌 브라우저도 이 스크립트가 자동으로 해제·정리·1회 새로고침해 스스로 복구. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    if(!rs.length) return;
    Promise.all(rs.map(function(r){return r.unregister();})).then(function(){
      if(window.caches && caches.keys){
        caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));})
          .then(function(){
            if(!sessionStorage.getItem('sw_cleared')){ sessionStorage.setItem('sw_cleared','1'); location.reload(); }
          });
      }
    });
  }).catch(function(){});
}
</script>
