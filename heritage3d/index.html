<style>
:root{--panel:rgba(22,16,11,.86);--line:rgba(255,236,210,.18);--ink:#f3eadb;--muted:#c8b9a2;--gold:#e7b75a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#cfd8e0;color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}.btn{background:var(--panel);border:1px solid var(--line);padding:7px 11px;border-radius:9px;cursor:pointer;min-height:36px;white-space:nowrap}a.btn:not([hidden]){display:inline-flex}.btn.main{background:var(--gold);color:#1d1408;border-color:var(--gold);font-weight:700}

#pip{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 58px);width:132px;z-index:7;background:rgba(20,13,8,.88);border:2px solid var(--gold);border-radius:10px;padding:5px;color:#f3ead6;font:12px "Gowun Dodum",sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}#pip video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;display:block;background:#000}#pip b{display:block;color:#f2d27a;font:15px "Do Hyeon",sans-serif;margin-top:4px}#pip span{display:block;line-height:1.35}

#quest{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 58px);z-index:7;width:230px;background:rgba(36,24,14,.9);border:2px solid #d8a838;border-radius:12px;padding:9px 11px;color:#f3ead6;font:13.5px "Gowun Dodum",sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}#quest b{display:block;color:#f2d27a;font:17px "Do Hyeon",sans-serif;margin-bottom:4px}#quest ol{margin:4px 0 0;padding-left:18px;line-height:1.55}#quest li.ok{color:#9fd08a;text-decoration:line-through}#quest.min ol,#quest.min p{display:none}

#sbG a{display:block;text-decoration:none;color:#2b1d12;background:#fffaf0;border:1px solid #d8c8a0;border-radius:10px;padding:8px 6px;font:13px "Gowun Dodum",sans-serif}

#sbG .pr{font-size:11.5px;color:#8a7a5a}

@media (max-width:640px){#quest{top:auto;bottom:calc(env(safe-area-inset-bottom) + 300px);width:190px;font-size:12.5px}}
#card{position:fixed;inset:0;z-index:20;background:rgba(10,7,4,.7);display:grid;place-items:center;padding:14px}#card .in{width:min(520px,100%);background:#f6efe2;color:#2a1d12;border-radius:14px;padding:18px;display:grid;gap:10px}#card h2{margin:0;font:700 22px "Noto Serif KR",serif}#card p{margin:0;line-height:1.7;font-size:15.5px}#cI{height:min(240px,34vh);border-radius:10px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#8a6e52,#2a1e14 75%);overflow:hidden}#cI img{height:92%;width:auto;max-width:92%;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.55))}#cB{display:flex;gap:6px;flex-wrap:wrap}#cB .btn{background:#d8a838!important;color:#1d1408!important;justify-self:auto!important}#card .in{max-height:92vh;overflow:auto}#card .btn{justify-self:end;background:#3b2a1c;color:#fff4dc}
#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% 40%,#5a3a20,#140e09 70%);color:var(--ink);transition:opacity .8s;text-align:center}#load b{display:block;font:34px "Do Hyeon",sans-serif;letter-spacing:.5px;margin:6px 0 10px;color:#fff4dc;text-shadow:0 2px 0 rgba(0,0,0,.25)}#load span{display:block;min-height:1.4em;font:15px "Gowun Dodum",sans-serif;color:#e8d6b0;transition:opacity .35s}#load i{display:block;font:normal 13px "Gowun Dodum",sans-serif;letter-spacing:3px;color:#d8a838}#ldMu{width:64px;height:76px;margin:0 auto 6px;position:relative;animation:ldHop 1.1s ease-in-out infinite}#ldMu:before{content:"";position:absolute;inset:8px 6px 0;border-radius:50% 50% 46% 46%;background:#f6f1e6;box-shadow:inset -6px -8px 0 rgba(0,0,0,.06)}#ldMu:after{content:"";position:absolute;left:17px;top:30px;width:30px;height:6px;background:radial-gradient(circle,#222 2.6px,transparent 3px) 0 0/15px 6px repeat-x}#ldHat{position:absolute;left:4px;top:0;width:56px;height:16px;border-radius:50%;background:#1d1d1d;border-bottom:3px solid #b8322a;z-index:2}#ldSh{width:46px;height:8px;margin:0 auto 14px;border-radius:50%;background:rgba(0,0,0,.35);animation:ldSh 1.1s ease-in-out infinite}#ldBar{width:min(260px,62vw);height:4px;margin:18px auto 0;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}#ldBar:after{content:"";display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,transparent,#f2d27a,transparent);animation:ldRun 1.3s linear infinite}@keyframes ldHop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-14px) scale(.96,1.04)}80%{transform:translateY(0) scale(1.06,.94)}}@keyframes ldSh{0%,100%{transform:scale(1);opacity:.9}45%{transform:scale(.7);opacity:.5}}@keyframes ldRun{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
