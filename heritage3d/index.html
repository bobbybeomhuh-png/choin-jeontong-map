<script type="module">
import * as THREE from 'three';
const VSRC=()=>SITEB&&SITEB.video?'../world3d/media/full_'+SITEB.video+'.mp4':SITEB&&SITEB.short?'media/shorts/'+SITEB.short+'.mp4':null;let pipS=null,VBLOB=null;
/* 서버가 구간 요청을 안 받아 중간으로 못 넘기므로, 영상을 한 번 통째로 받아 메모리에서 재생 */function vblob(){if(!VBLOB)VBLOB=fetch(VSRC()).then(r=>r.blob()).then(b=>URL.createObjectURL(b)).catch(()=>VSRC());return VBLOB}
function vset(v,t0,play){vblob().then(u=>{if(v.src!==u){v.src=u}const go=()=>{try{v.currentTime=t0}catch(e){}if(play())v.play().catch(()=>{})};if(v.readyState>=1)go();else v.addEventListener('loadedmetadata',go,{once:true})})}
function fmtT(a){return Math.floor(a)+'초'}
/* 복원 의뢰서: SITEB.quest = {t, d, steps:[[보여줄 이름, 맞출 지점 이름]]}. 지점에 들어가면 체크, 다 채우면 도장 */
let QD=null;function questInit(){const Q=SITEB.quest;if(!Q)return;try{QD=new Set(JSON.parse(localStorage.getItem('muui-h3-quest-'+SITE)||'[]'))}catch(e){QD=new Set()}questDraw();$('#quest').hidden=false;if(innerWidth<700)$('#quest').classList.add('min');$('#quest').addEventListener('click',()=>$('#quest').classList.toggle('min'));try{questMarks()}catch(e){console.warn('qmk',e)}}
function questDraw(){const Q=SITEB.quest;if(!Q||!QD)return;const n=Q.steps.filter(s=>QD.has(s[1])).length;$('#quest').innerHTML=`<b>${Q.t} (${n}/${Q.steps.length})</b><p>${n>=Q.steps.length?'복원 완료! 도장을 받았어요.':Q.d}</p><ol>${Q.steps.map(s=>`<li class="${QD.has(s[1])?'ok':''}">${s[0]}</li>`).join('')}</ol>`+(SHARDS&&SHARDS.length?`<p style="margin:4px 0 0;color:#f2d27a">기와 조각 ${SHARDS.filter(x=>!x.visible).length} / ${SHARDS.length}</p>`:'');try{questMarkSet()}catch(e){}}
/* 의뢰 지점 표시: 노란 빛기둥과 바닥 고리. 다음 갈 곳=진한 금색 깜빡임, 남은 곳=옅은 노랑, 끝낸 곳=초록 고리만 */
let QMK=null;
function qSpot(t){return SPOTS.find(s=>s.t===t||(s.t&&s.t.startsWith(t+' ')))}
function questMarks(){const Q=SITEB.quest;if(!Q||QMK)return;QMK=[];window.__QMK=QMK;const W=SITE==='worldmap'?3.2:1;
 const bt=new THREE.CanvasTexture((()=>{const c=document.createElement('canvas');c.width=4;c.height=128;const q=c.getContext('2d'),g=q.createLinearGradient(0,0,0,128);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,1)');q.fillStyle=g;q.fillRect(0,0,4,128);return c})());
 for(const st of Q.steps){const sp=qSpot(st[1]);if(!sp){QMK.push(null);continue}const r=Math.max(.6,Math.min(1.5,(sp.r||1.5)*.55))*W,g=new THREE.Group();
  const bm=new THREE.MeshBasicMaterial({map:bt,color:0xffd34a,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide,fog:false});const beam=new THREE.Mesh(new THREE.CylinderGeometry(r*.85,r*.85,4.2*W,24,1,true),bm);beam.position.y=2.1*W;beam.renderOrder=5;g.add(beam);
  const rm=new THREE.MeshBasicMaterial({color:0xffd34a,transparent:true,opacity:.9,depthWrite:false,fog:false});const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.09*W,8,40),rm);ring.rotation.x=-Math.PI/2;ring.position.y=.06;ring.renderOrder=5;g.add(ring);
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.45*W),new THREE.MeshBasicMaterial({color:0xff9f0a,fog:false}));gem.position.y=4.8*W;gem.scale.y=1.5;g.add(gem);g.position.set(sp.x,floorAt(sp.x,sp.z,(typeof sp.y==='number'?sp.y:0)+1.2)+.02,sp.z);g.userData={beam,ring,bm,rm,gem,W};scene.add(g);QMK.push(g)}
 questMarkSet()}
function questMarkSet(){if(!QMK)return;const Q=SITEB.quest;let next=-1;Q.steps.forEach((st,i)=>{if(next<0&&!QD.has(st[1])&&QMK[i])next=i});
 Q.steps.forEach((st,i)=>{const g=QMK[i];if(!g)return;const u=g.userData,done=QD.has(st[1]);u.state=done?0:i===next?2:1;u.beam.visible=!done;u.bm.color.set(i===next?0xff9f0a:0xffd84a);u.bm.opacity=i===next?.8:.5;u.gem.visible=i===next;u.rm.color.set(done?0x5fc24a:i===next?0xff9f0a:0xffd84a);u.rm.opacity=done?.7:i===next?.95:.5})}
function questMarkTick(){if(!QMK)return;const t=performance.now()/1000;for(const g of QMK){if(!g)continue;const u=g.userData;if(u.state===2){const k=.5+.5*Math.sin(t*3.2);u.bm.opacity=.6+.35*k;u.ring.scale.setScalar(1+.12*k);u.gem.rotation.y=t*1.6;u.gem.position.y=(4.8+.25*Math.sin(t*2.4))*u.W}}}
/* ---- 재미 1: 무이 부르기(C) / 재미 2: 도장 손맛 / 재미 3: 길의 기와 조각 ---- */
function cuteVoice(){if(!AC||!AM)return;const t=AC.currentTime,f=520+Math.random()*180;for(const[i,ff]of[[0,f],[1,f*1.26]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(ff*.85,t+i*.11);o.frequency.exponentialRampToValueAtTime(ff*1.15,t+i*.11+.09);g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.09,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.14);o.connect(g).connect(AM);o.start(t+i*.11);o.stop(t+i*.11+.16)}}
/* 하이파이브: 무이가 옆에 있을 때 부르기를 한 번 더 */
let ME_N=null,ME_T=0;
function slapSnd(){if(!AC||!AM)return;const t=AC.currentTime+.32,n=Math.floor(AC.sampleRate*.08),bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=bf;f.type='bandpass';f.frequency.value=2200;f.Q.value=.8;g.gain.value=.5;src.connect(f).connect(g).connect(AM);src.start(t)}
