<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>초인 지도 · 관리자 통계</title>
<style>
:root{--bg:#f3ece0;--panel:#fbf7ef;--ink:#3b3326;--t2:#6f6553;--t3:#a39880;--line:#e2d8c4;--gold:#a9803a;--teal:#1d8a6a;--red:#c0392b;--blue:#5865F2;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,system-ui,sans-serif;line-height:1.6;}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px 70px;}
h1{font-size:22px;margin:0 0 2px;}
.sub{color:var(--t3);font-size:13px;margin-bottom:22px;}
#gate{max-width:340px;margin:80px auto;text-align:center;}
#gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:10px 0;}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:28px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;}
.card b{display:block;font-size:26px;font-weight:800;line-height:1.1;}
.card span{font-size:12px;color:var(--t2);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
@media(max-width:680px){.grid2{grid-template-columns:1fr;}}
.sec{margin-bottom:30px;}
.sec h2{font-size:15px;margin:0 0 12px;color:var(--gold);letter-spacing:.3px;}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:13px;}
.bar .lab{flex:0 0 120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .track{flex:1;background:#eae0cc;border-radius:6px;height:19px;position:relative;overflow:hidden;min-width:40px;}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--teal);}
.bar .num{flex:0 0 52px;text-align:right;font-weight:700;color:var(--t2);}
.funnel .bar .lab{flex:0 0 130px;font-weight:600;}
.funnel .fill{background:linear-gradient(90deg,var(--teal),var(--gold));}
.funnel .pct{flex:0 0 46px;text-align:right;color:var(--t3);font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
th{color:var(--t3);font-weight:600;}
.muted{color:var(--t3);font-size:13px;}
.reload{float:right;font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--t2);}
.hours{display:flex;align-items:flex-end;gap:2px;height:90px;}
.hours .h{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
.hours .h span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:8px;color:var(--t3);}
</style>
</head>
<body>

<div id="gate">
  <h1>초인 지도 · 관리자</h1>
  <p class="muted">비밀번호를 입력하세요</p>
  <input id="pw" type="password" placeholder="비밀번호" autofocus onkeydown="if(event.key==='Enter')tryUnlock()">
  <button onclick="tryUnlock()">들어가기</button>
  <p id="gerr" class="muted" style="color:#b5476f;min-height:16px"></p>
</div>

<div class="wrap" id="dash" hidden>
  <button class="reload" onclick="load()">↻ 새로고침</button>
  <h1>방문자 통계</h1>
  <div class="sub" id="updated">불러오는 중…</div>

  <div class="cards" id="cards"></div>

  <div class="sec">
    <h2>전환 퍼널 (사람 기준 · 얼마나 남는지)</h2>
    <div class="funnel" id="funnel"></div>
  </div>

  <div class="grid2">
    <div class="sec"><h2>유입 경로 (어디서 왔나)</h2><div id="refs"></div></div>
    <div class="sec"><h2>기기</h2><div id="devs"></div></div>
  </div>

  <div class="grid2">
    <div class="sec"><h2>인기 지역 TOP 12</h2><div id="regions"></div></div>
    <div class="sec"><h2>인기 영상 TOP 10</h2><div id="videos"></div></div>
  </div>

  <div class="sec">
    <h2>시간대별 방문 (0~23시)</h2>
    <div class="hours" id="hours"></div>
  </div>

  <div class="sec">
    <h2>최근 14일 방문 흐름</h2>
    <div id="daily"></div>
  </div>

  <div class="sec">
    <h2>최근 활동 30건</h2>
    <table><thead><tr><th>시각</th><th>행동</th><th>내용</th><th>유입</th></tr></thead><tbody id="recent"></tbody></table>
  </div>
</div>

<script>
var SUPA_URL='https://moavztygngbafhxztghx.supabase.co';
var SUPA_KEY='sb_publishable_9D-u0PH9oM0jSRoJmfGfZQ_q5t3DldZ';
var _H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};
var ADMIN_PW='Incho2626!';   // ★비번 (이 문자열만 바꾸면 변경)

function tryUnlock(){
  if(document.getElementById('pw').value===ADMIN_PW){
    try{ sessionStorage.setItem('choin_admin','1'); }catch(e){}
    document.getElementById('gate').hidden=true; document.getElementById('dash').hidden=false; load();
  } else document.getElementById('gerr').textContent='비밀번호가 틀렸어요.';
}
try{ if(sessionStorage.getItem('choin_admin')==='1'){ document.getElementById('gate').hidden=true; document.getElementById('dash').hidden=false; } }catch(e){}

var LABELS={visit:'방문',region:'지역 클릭',video:'영상 클릭',discord:'디코 클릭',vote:'투표',subscribe:'구독',view:'전체·자랑 보기',test:'(테스트)'};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ago(iso){var s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return Math.floor(s/86400)+'일 전';}
function el(id){return document.getElementById(id);}
function barRows(arr,color,total){ // arr=[[label,val]]
  if(!arr.length) return '<p class="muted">아직 없음</p>';
  var max=arr[0][1]||1;
  return arr.map(function(x){
    var pct=total?(' <span style="color:var(--t3)">'+Math.round(x[1]/total*100)+'%</span>'):'';
    return '<div class="bar"><div class="lab">'+esc(x[0])+'</div><div class="track"><div class="fill" style="width:'+Math.round(x[1]/max*100)+'%'+(color?(';background:'+color):'')+'"></div></div><div class="num">'+x[1]+pct+'</div></div>';
  }).join('');
}
function topCount(rows,type,field){ // field default detail
  var m={}; rows.forEach(function(r){ if(r.type===type){ var k=(field?r[field]:r.detail)||'(없음)'; m[k]=(m[k]||0)+1; } });
  return Object.keys(m).map(function(k){return[k,m[k]];}).sort(function(a,b){return b[1]-a[1];});
}
function distinctSids(rows,pred){ var s={}; rows.forEach(function(r){ if(pred(r)&&r.sid) s[r.sid]=1; }); return Object.keys(s).length; }

async function load(){
  el('updated').textContent='불러오는 중…';
  var rows;
  try{ rows=await fetch(SUPA_URL+'/rest/v1/events?select=type,detail,created_at,sid,ref&order=created_at.desc&limit=20000',{headers:_H}).then(function(r){return r.ok?r.json():Promise.reject(r.status);}); }
  catch(e){ el('updated').textContent='데이터를 못 불러왔어요. (events 테이블/읽기 정책/컬럼 확인)'; return; }
  if(!rows.length){ el('updated').textContent='아직 데이터가 없어요. 방문·클릭이 쌓이면 나옵니다.'; return; }

  var visitors=distinctSids(rows,function(){return true;});
  el('updated').textContent='업데이트: 방금 · 총 '+rows.length.toLocaleString()+'건 기록 · 순방문자 '+visitors+'명';

  var by={}; rows.forEach(function(r){ by[r.type]=(by[r.type]||0)+1; });
  el('cards').innerHTML=[
    ['방문',by.visit||0],['순방문자',visitors],['지역 클릭',by.region||0],
    ['영상 클릭',by.video||0],['디코 클릭',by.discord||0],['투표',by.vote||0],['구독',by.subscribe||0]
  ].map(function(x){return '<div class="card"><b>'+x[1].toLocaleString()+'</b><span>'+x[0]+'</span></div>';}).join('');

  // 퍼널(사람 기준)
  var stages=[
    ['방문한 사람', visitors],
    ['지역 클릭', distinctSids(rows,function(r){return r.type==='region';})],
    ['영상 클릭', distinctSids(rows,function(r){return r.type==='video';})],
    ['디코 클릭', distinctSids(rows,function(r){return r.type==='discord';})],
    ['구독', distinctSids(rows,function(r){return r.type==='subscribe';})]
  ];
  var base=stages[0][1]||1;
  el('funnel').innerHTML=stages.map(function(s){
    return '<div class="bar"><div class="lab">'+s[0]+'</div><div class="track"><div class="fill" style="width:'+Math.round(s[1]/base*100)+'%"></div></div><div class="num">'+s[1]+'</div><div class="pct">'+Math.round(s[1]/base*100)+'%</div></div>';
  }).join('');

  // 유입경로 (visit의 ref)
  el('refs').innerHTML=barRows(topCount(rows.filter(function(r){return r.type==='visit';}),'visit','ref').slice(0,8), 'var(--blue)', by.visit);
  // 기기 (visit의 detail)
  el('devs').innerHTML=barRows(topCount(rows.filter(function(r){return r.type==='visit';}),'visit','detail'), 'var(--teal)', by.visit);
  // 인기 지역
  el('regions').innerHTML=barRows(topCount(rows,'region').slice(0,12), 'var(--teal)');
  // 인기 영상
  el('videos').innerHTML=barRows(topCount(rows,'video').slice(0,10), 'var(--red)');

  // 시간대
  var hrs=new Array(24).fill(0); rows.forEach(function(r){ if(r.type==='visit'){ var d=new Date(r.created_at); if(!isNaN(d)) hrs[d.getHours()]++; } });
  var hmax=Math.max(1,Math.max.apply(null,hrs));
  el('hours').innerHTML=hrs.map(function(v,i){return '<div class="h" style="height:'+Math.round(v/hmax*100)+'%" title="'+i+'시 · '+v+'회">'+(i%3===0?'<span>'+i+'</span>':'')+'</div>';}).join('');

  // 최근 14일
  var days={}; for(var i=13;i>=0;i--){ days[new Date(Date.now()-i*86400000).toISOString().slice(0,10)]=0; }
  rows.forEach(function(r){ if(r.type==='visit'){ var d=(r.created_at||'').slice(0,10); if(d in days) days[d]++; } });
  var dk=Object.keys(days), dmax=Math.max(1,Math.max.apply(null,dk.map(function(d){return days[d];})));
  el('daily').innerHTML=dk.map(function(d){return '<div class="bar"><div class="lab">'+d.slice(5)+'</div><div class="track"><div class="fill" style="width:'+Math.round(days[d]/dmax*100)+'%;background:var(--gold)"></div></div><div class="num">'+days[d]+'</div></div>';}).join('');

  // 최근 활동
  el('recent').innerHTML=rows.slice(0,30).map(function(r){return '<tr><td>'+ago(r.created_at)+'</td><td>'+(LABELS[r.type]||esc(r.type))+'</td><td>'+esc(r.detail||'')+'</td><td class="muted">'+esc(r.ref||'')+'</td></tr>';}).join('');
}
if(!document.getElementById('dash').hidden) load();
</script>
</body>
</html>
