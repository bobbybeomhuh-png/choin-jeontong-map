function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
function sw(w){
 document.getElementById('fq').style.display=w==='q'?'block':'none';
 document.getElementById('fs').style.display=w==='s'?'block':'none';
 document.getElementById('bq').className=w==='q'?'on':'';
 document.getElementById('bs').className=w==='s'?'on':'';
}
async function go(){
 const pw=document.getElementById('pw').value,m=document.getElementById('msg');m.textContent='';
 try{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  const d=JSON.parse(new TextDecoder().decode(pt));
  document.getElementById('gate').style.display='none';
  document.getElementById('bar').style.display='flex';
  document.getElementById('ts').textContent='스냅샷 '+d.ts;
  document.getElementById('fq').srcdoc=d.queue;
  document.getElementById('fs').srcdoc=d.sns;
 }catch(e){ m.textContent='비밀번호 틀림'; }
}
</script></body></html>
