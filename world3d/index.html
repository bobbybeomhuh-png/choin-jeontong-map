<!-- ⏱ 2026-11-12 거북선 미니어처(모닥불 서쪽 잔디) / 2026-11-12 환경 효과음(바람·연못 물결과 원앙·모닥불 타닥·새·풀벌레), 촬영용 카메라 고리 / 2026-11-12 악사 다섯 연주 자세(팔이 악기를 겨눔, 북채·배소·대금·완함·거문고를 손에 맞춤) / 2026-11-12 석굴암 미니어처(오른쪽 잔디, 들어가면 실제 크기 석굴암) / 2026-11-12 00:20 무이의 세계 지도(블록판 지도+3D 안 바로 가기), 폰 위쪽 막대는 메뉴로 접기 / 2026-11-11 23:30 앉는 자리 넷(연못가 마루 원앙 먹이·평상 윷·가마 불멍 장작·지우산 평상 차 한 잔) / 2026-11-11 22:30 기와집 안: 회랑 양끝으로 돌아 뒤로 가서 돌계단으로 높은 터, 세 채 앞문 열기. 본채=무이 전시실(유물 진열장 5·내 달항아리·도장판·안내 무이), 왼쪽=복원대 공방(블록판 복원대 유물 10점·소장처 퀴즈), 오른쪽=쇼츠 상영방. 회랑 안팎 못 건넘, 뒷산 물림, 도장 14개 / 2026-11-11 20:30 거대 달항아리 복원 현장(나무 서남쪽): 블록판과 같은 22분 시계로 금 20곳이 차례로 6단계 진행, 복원단 다섯(바닥·받침대·비계), 진행판, 같이 작업하기 6단계(조사·세척·접합·충전·정형·색맞춤), 카드·도장 13개 / 2026-11-11 19:00 도공 부스(가마 옆): 물레 달항아리 빚기 4단계(빚기·위 반구 얹기·이음매·가마 불), 받침대에 내 항아리, 도장 12개 / 2026-11-11 18:00 기본 무이를 매쉬(피치보드 턴어라운드 4장, 30크레딧)로 다시 만들고 블렌더 직접 리깅(팔 옆으로 뻗은 비율), 일월오봉도 빈 폭 함께 그리기 4단계, 도장 11개 / 2026-11-11 16:30 3차: 상모 쓴 기본 무이(블렌더 직접 모델링·리깅, 동작 38개, 고르기 맨 앞·대문 맞이), 북 치기 차분하게(센 박만 오른팔, 소리 부드럽게), 뚫고 지나가기 막음(회랑 기둥·회랑 뒤·나무·등불 기둥·솟대·지우산·병풍·무이들), 회랑 마루 높이, 점프(스페이스·폰 버튼), 1인칭(V) / 2026-11-11 14:30 2차-3: 유물 체험(측우기 재 보기 4단계·다보탑 다섯 층 쌓기·향로 확대경 다섯 곳, 블록판 문구), 설명 카드, 복원단 도장판 10개와 단원증, 프레임 오류에도 안 멈추게 / 2026-11-11 13:00 2차-2: 놀이 마당(투호·제기차기·널뛰기, 블록판 규칙, 최고 기록 저장, 효과음) / 2026-11-11 12:10 2차-1: 하루 22분 낮밤 순환(블록판과 같은 시계, 노을·별·달), 무이 악사 다섯(북·거문고·대금·배소·완함) 연주 동작과 굿거리 16마디, 공연 보기·북 같이 치기, 소리 켜기/끄기 / 2026-11-11 10:30 1차 채우기: 회랑 뒤 기와집 3채·뒷산, 네모 연못(섬·소나무·연꽃·원앙)·차일 마루, 장독대, 장승·솟대, 청사초롱 등불줄, 평상·지우산, 벽돌 가마(불·연기), 악사 무대(악기), 안내판, 장터, 큰 무이 동상, 꽃담, 디딤돌, 포털 2(발굴 터·팔복), 좌우 방향 고침 / 2026-11-11 00:20 모닥불 어깨춤(밤·같이 추기), 반장 무이 부탁 5개, 기념사진(3·2·1, 플래시, 저장), 폰 배치 정리 / 2026-11-10 23:00 초판(시험): 블록판과 따로, 같은 공간을 3D로. 유물은 직접 모델링(공개 3D 자료는 이용 조건 미확인이라 안 씀), 무이는 매쉬 모델+블렌더 직접 리깅 -->
<style>
:root{--panel:rgba(22,16,11,.84);--line:rgba(255,236,210,.18);--ink:#f3eadb;--muted:#c8b9a2;--gold:#e7b75a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#cfd8e0;color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}

#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:8px 16px;font-size:14.5px;text-align:center;max-width:calc(100vw - 28px);transition:opacity .6s;pointer-events:none}

#wk{position:fixed;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);width:min(560px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:7px}#wk .hd{display:flex;gap:10px;align-items:center}#wkS{font-size:13px;color:var(--muted)}#wkT{font:21px "Do Hyeon",sans-serif;color:var(--gold);flex:1}#wkX{min-height:32px;padding:3px 10px;font-size:14px}#wkH{margin:0;font-size:14.5px;line-height:1.5}#wkW{display:grid;gap:6px}#wkW:empty{display:none}#wkW>.btn{min-height:40px;font-size:16px}#wkB{min-height:42px;font-size:16px}#wkB:disabled{opacity:.45}#wkPr{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}#wkP{display:block;height:100%;background:var(--gold);width:0}
#rnr{width:100%;display:block;touch-action:none;cursor:pointer;border:2px solid #3b2a1c;border-radius:6px}.rnk{display:flex;justify-content:center;align-items:center;gap:14px}#rnv{font:20px "Do Hyeon",sans-serif;min-width:110px;text-align:center}.rnrow{display:flex;gap:6px;align-items:center}.rnrow b{flex:0 0 66px;font:15px "Do Hyeon",sans-serif;color:var(--gold)}.rnrow .btn{flex:1;min-height:36px;padding:2px 4px;font-size:15px}
#yww{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);bottom:var(--wkh,230px);z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none}#ywc{height:100%;width:auto;max-width:calc(100vw - 20px);aspect-ratio:2/9;border:6px solid #5a3420;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.45);touch-action:none;pointer-events:auto;cursor:crosshair;background:#efe6cf}.ywp{display:flex;gap:8px;justify-content:center}.ywp button{width:58px;height:44px;border-radius:10px;border:3px solid #3b2a1c;cursor:pointer;display:grid;place-items:end center;padding-bottom:2px}.ywp button span{font:13px "Do Hyeon",sans-serif;color:#fff;text-shadow:0 1px 2px #000}.ywp button.on{outline:3px solid var(--gold);outline-offset:2px}
#mgw{position:fixed;inset:0;z-index:7;touch-action:none;cursor:none}#mgc{display:block;width:100%;height:100%}
#card,#st{position:fixed;inset:0;z-index:30;background:rgba(10,7,4,.8);display:grid;place-items:center;padding:12px;overflow:auto}#card .in,#st .in{width:min(560px,100%);background:#f4efe6;color:#2a1d12;border-radius:14px;padding:16px;display:grid;gap:10px;max-height:calc(100vh - 24px);overflow:auto}#cImg{width:100%;max-height:240px;object-fit:cover;border-radius:10px}#card h2{margin:0;font:700 24px "Noto Serif KR",serif}#card p{margin:0;line-height:1.6}#cF{display:grid;gap:8px}#cF div{display:grid;gap:2px;border-left:4px solid #c0392b;padding-left:10px}#cF b{font-size:15px}#cF span{font-size:14px;color:#4a3a2a}.sm{font-size:12.5px;color:#7a6650}#card .btn,#st .btn{color:#2a1d12;background:#e8dfcf;border-color:#cdbfa6}#card .btn.main,#st .btn.main{background:var(--gold);border-color:var(--gold)}
#st .hd{display:flex;gap:10px;align-items:center}#st .hd b{font:700 22px "Noto Serif KR",serif;flex:1}#stL{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.st{display:grid;gap:3px;justify-items:center;text-align:center;border:1px solid #d9ccb4;border-radius:10px;padding:10px 6px}.st i{width:54px;height:54px;border-radius:50%;border:2px dashed #c9b796;display:grid;place-items:center;font:700 26px "Noto Serif KR",serif;font-style:normal;color:#fff3dc}.st.on i{background:#c0392b;border:none}.st b{font-size:14px}.st span{font-size:12px;color:#7a6650}.st .btn{min-height:30px;padding:2px 12px;font-size:13px}
#bJump{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 96px);width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.55);color:#fff;font:16px "Do Hyeon",sans-serif;z-index:4;touch-action:none}

#jh{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 58px);z-index:4;width:min(300px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:4px;pointer-events:none}#jhT{font:17px "Do Hyeon",sans-serif;color:var(--gold)}#jhN{font-size:13px}#jhS{display:flex;gap:3px;flex-wrap:wrap}#jhS i{font-style:normal;font-size:11.5px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--muted)}#jhS i.ok{color:#9fd39a}#jhS i.on{background:var(--gold);color:#1d1408}#jhD{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}@media (max-width:560px){#jh{top:calc(env(safe-area-inset-top) + 92px)}}
#ws{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100vw - 16px));max-height:calc(100dvh - 16px);box-sizing:border-box;padding:10px;display:grid;gap:8px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}#whead{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}#wimg{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#f4f1ea}#wname{display:block;font:15px "Do Hyeon",sans-serif;color:var(--muted)}#wstep{display:block;font:19px/1.2 "Do Hyeon",sans-serif;color:var(--gold)}#wcv{width:min(100%,calc(100dvh - 196px));aspect-ratio:1;justify-self:center;display:block;background:#efe7d6;border-radius:8px;touch-action:none;cursor:grab}#whint{margin:0;font-size:15px;line-height:1.4;text-align:center}#wpal{display:flex;gap:8px;justify-content:center}#wpal button{width:54px;height:44px;border:3px solid #3b2a1c;border-radius:8px;cursor:pointer}#wpal button[aria-pressed=true]{outline:3px solid #fff;outline-offset:2px;transform:translateY(-3px)}#wprog{height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}#wpf{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.qh{margin:0;font-weight:700}.qrow{display:flex;gap:6px;flex-wrap:wrap}.qrow .btn.ok{background:#3f8f5a!important;color:#fff!important}.qrow .btn.no{background:#a8322a!important;color:#fff!important}

 r:{metal:{t:'신라 금관 복원 완료',i:'방금 손질한 금관의 실제 모습이에요. 1500년 전 신라 무덤 주인이 쓰던 천마총 금관입니다. 지금은 국립경주박물관에 있어요.',f:[['연습이었는데요?','천마총은 더 큰 황남대총을 파기 전에 연습 삼아 시작한 무덤이었다고 해요. 거기서 금관이 나와 버렸습니다.'],['그날 오후','1973년 7월 26일 늦은 오후, 발굴 석 달여 만에 무덤 주인의 머리 부근에서 모습을 드러냈어요.'],['이름의 주인공','천마총이라는 이름은 함께 나온 하늘을 나는 말 그림에서 왔어요. 이 무덤의 유물은 1만 점이 넘습니다.']],c:'사진 국립중앙박물관, 공공누리 제1유형',n:'게임 속 복원 과정은 놀이를 위한 연출이며 실제 보존 처리와 다릅니다.'},
  ceramic:{t:'고려 청자 매병 복원 완료',i:'구름 사이를 나는 학을 새겨 넣은 고려 청자 매병이에요. 사진 속 병은 지금 미국 메트로폴리탄미술관에 있습니다.',f:[['주꾸미가 찾은 보물선','2007년 태안 앞바다에서 잡힌 주꾸미 한 마리가 청자 접시를 끌어안고 올라왔어요. 신고 끝에 고려 배가 발견되었고, 유물 2만 점 넘게 건져 올렸습니다.'],['이 귀한 병에 참기름을?','태안 마도 2호선에서 나온 매병 목에 대나무 꼬리표가 달려 있었어요. 받는 사람 이름과 함께 참기름, 꿀이라고 적혀 있었답니다. 고려판 택배 송장이죠.'],['고려의 인기 무늬','구름과 학은 고려청자에서 사랑받은 무늬예요. 국보 청자 상감운학문 매병은 간송미술관에 있습니다.']],c:'사진 메트로폴리탄미술관, CC0',n:'게임 속 복원 과정은 놀이를 위한 연출이며 실제 보존 처리와 다릅니다.'},
  painter:{t:'단청 머리초 복원 완료',i:'나무 건물의 기둥과 보에 칠하는 화려한 무늬를 단청이라고 해요. 방금 칠한 건 보 끝에 그리는 머리초를 단순하게 옮긴 무늬예요.',f:[['다섯 가지 색','단청은 청, 적, 황, 백, 흑의 오방색을 바탕으로 칠해요. 나무를 비바람과 벌레로부터 지키는 역할도 했답니다.'],['머리초','기둥이나 보의 끝부분에 그리는 무늬를 머리초라고 해요. 연꽃 무늬가 대표적이에요.'],['색의 장인','단청을 그리는 장인을 단청장이라고 해요. 단청장은 국가무형유산으로 지정되어 있습니다.']],c:'무늬 그림 무이 복원 마당',n:'게임 속 무늬는 단청 머리초를 단순하게 그린 연출입니다.'}}},
 en:{title:'MUUI MADANG',sub:'Restore Korean treasures, rest in a hanok courtyard.',g1:'Walk up to a Muui restorer and mend a treasure together, one brushstroke at a time.',g2:'Sit on the wooden porch, by the brazier or the pond. Doing nothing is fine here.',g3:'Every night at 9 PM Korea time, we light the courtyard lanterns together.',g4:'No sign-up, no chat. Everyone who opens this link shares the same courtyard.',howPC:'WASD to walk · drag to look around · buttons below to jump to a spot',howTouch:'Left circle to walk · drag to look around · buttons below to jump to a spot',enter:'Enter the courtyard',again:'Back to the courtyard',menu:'Menu',invite:'Invite',help:'Guide',soundOn:'Sound on',soundOff:'Sound off',pMap:'Map',atlasT:"Muui's World Map",atlasSub:'{0} of {1} treasures restored. Korean treasures now live all over the world.',story:'Story',see:'View',restored:'{0}, restored',quizQ:'Where is this treasure today?',quizOk:'Correct!',quizNo:'Not quite. The right answer is in green.',nowAt:'Now at {0}, {1}',nextJob:'Next job: {0}. Shall we?',aYut:'Throw yut sticks',yut:{do:'<b>Do!</b> One step. In yutnori, do stands for a pig.',gae:'<b>Gae!</b> Two steps. Gae is a dog.',geol:'<b>Geol!</b> Three steps. Geol stands for a sheep.',yut:'<b>Yut!</b> Four steps and you throw again. It stands for a cow.',mo:'<b>Mo!</b> Five steps and another throw! The horse, the best throw of all.'},info:{sotdae:['Sotdae · raised by Carpenter Muui','People believed the wooden birds on top carried the village\'s wishes up to the sky.'],jangseung:['Jangseung · carved by Carpenter Muui','Guardian posts at the village entrance that keep bad luck away. They come as a pair, a great general above and a female general below.'],pyeong:['Pyeongsang · built by Carpenter Muui','A wooden platform where neighbours sat together on summer nights. Sit down and throw the yut sticks.'],jang:['Jangdokdae · onggi jars by Potter Muui','Clay jars for soy sauce, doenjang and gochujang. Onggi breathes, so the sauces ferment slowly and well.'],ondol:['Ondol chimney · fixed by Science Muui','A fire in the stove sends hot smoke under the stone floor to warm the room. That is ondol, Korean underfloor heating.'],chorong:['Cheongsa chorong · silk by Painter Muui','Blue above, red below. Lanterns lit for weddings and honoured guests.'],punggyeong:['Punggyeong · fish bell by Metal Muui','The fish under the eaves never closes its eyes, a reminder to stay awake and mindful.'],pond:['Square pond, round island','It reflects the old idea that the sky is round and the earth is square. Buyongji pond at Changdeokgung Palace has the same shape.'],gam:['Persimmon tree · kkachi-bap','A few persimmons are always left on the tree for winter birds. They are called magpie food.']},aTea:'Sip some tea',aWood:'Add firewood',aFeed:'Feed the ducks',lTea:['Warm barley tea. Take your time.','Listen to the wind chime under the eaves.','A breeze drifts through the courtyard.','You did well today.'],lWood:['Crackle. The wood catches.','Sparks drift up into the sky.','Warm your hands by the fire.'],lFeed:['The mandarin ducks paddle over. In Korea they stand for lifelong partners, so carved wooden ducks are given at traditional weddings.','Rings spread across the water.','The colourful one is the male; the quieter one is the female.'],pBench:'Restore',pMaru:'Porch',pFire:'Brazier',pPond:'Pond',pBow:'Bow',sit:'Sit',stand:'Stand up',close:'Close',back:'Back to the courtyard',postcard:'Save postcard',talk:'Restore with {0}',talk2:'Talk to {0}',yes:"Let's do it",later:'Later',ok:'OK',next:'Next',pin:'Restore here',tag:'Restorer {0}',joined:'<b>Restorer {0}</b> entered the courtyard',bowed:'<b>Restorer {0}</b> bowed',youBow:'A small bow to everyone in the courtyard.',lIn:'Lanterns in {0}',lOn:'Lanterns are lit',lMsg:'<b>The lanterns are being lit.</b> {0} treasures were restored in this courtyard today.',lMsg0:'<b>The lanterns are being lit.</b> Be the first to restore a treasure today.',online:'{0} online',copied:'<b>Link copied.</b> Friends who open it join this courtyard, no sign-up.',sendUrl:'Share this link: {0}',first:'Walk to the restorer with the gold marker, or tap <b>Restore</b> below.',seatHint:'Take your time. Move to stand up.',wrong:'This area takes another colour. Match the small dot inside it.',nogl:'3D is not available on this device',stepOf:'Step {0} of {1}',

 r:{metal:{t:'Silla gold crown, restored',i:'This is the real crown you just cleaned. It belonged to a Silla ruler about 1,500 years ago and was found in the Cheonmachong tomb. Today it is at Gyeongju National Museum.',f:[['It was only practice','Cheonmachong was excavated as a warm-up before the much larger Hwangnamdaechong tomb. Then a gold crown turned up.'],['That afternoon','Late in the afternoon of 26 July 1973, about three months into the dig, it appeared near the head of the person buried there.'],['Where the name comes from','Cheonmachong means Tomb of the Heavenly Horse, after a painting of a flying horse found inside. The tomb held more than 10,000 objects.']],c:'Photo: National Museum of Korea, KOGL Type 1',n:'The restoration here is playful and differs from real conservation work.'},

  painter:{t:'Dancheong pattern, restored',i:'Dancheong is the bright painting on the beams and pillars of Korean wooden buildings. What you painted is a simplified meoricho, the motif painted at the end of a beam.',f:[['Five colours','Dancheong is built on five traditional colours: blue, red, yellow, white and black. The paint also protected the wood from rain and insects.'],['Meoricho','The motif at the end of a beam or pillar is called meoricho. Lotus flowers are one of the most common designs.'],['Masters of colour','The artisans who paint dancheong are called dancheongjang. The craft is designated as a National Intangible Heritage of Korea.']],c:'Pattern drawing: MUUI MADANG',n:'The pattern is a simplified illustration.'}}}};
const bt=(k,...a)=>{let s=BSTR[lang][k];if(s===undefined)s=BSTR.ko[k];if(typeof s==='string')a.forEach((v,i)=>{s=s.replace('{'+i+'}',v)});return s};
const BL=()=>BSTR[lang];
const DC=['#c8432f','#3f8f72','#e2b23a','#2f5596'],FD=DC.map(h=>{const a=parseInt(h.slice(1),16),r=a>>16,g=(a>>8)&255,b=a&255,m=[217,208,189],k=.72;return`rgb(${(r+(m[0]-r)*k)|0},${(g+(m[1]-g)*k)|0},${(b+(m[2]-b)*k)|0})`});
function panelRegions(S){const R=[],add=(p,c,hx,hy)=>R.push({p,c,hx,hy,ok:false}),s=S/600,cx=300*s,cy=300*s;
 let p=new Path2D();p.rect(0,0,S,S);add(p,1,120*s,88*s);
 for(const side of[0,1])for(let k=0;k<3;k++){const y=56*s+k*163*s,X=v=>side?S-v:v;p=new Path2D();p.moveTo(X(0),y);p.lineTo(X(48*s),y+28*s);p.lineTo(X(96*s),y);p.lineTo(X(96*s),y+163*s);p.lineTo(X(48*s),y+191*s);p.lineTo(X(0),y+163*s);p.closePath();add(p,k===1?0:3,X(48*s),y+96*s)}
 p=new Path2D();p.rect(0,0,S,56*s);add(p,2,cx,28*s);p=new Path2D();p.rect(0,S-56*s,S,56*s);add(p,2,cx,S-28*s);
 p=new Path2D();p.arc(cx,cy,196*s,0,Math.PI*2);add(p,3,cx+Math.cos(-1.178)*176*s,cy+Math.sin(-1.178)*176*s);
 for(let k=0;k<8;k++){const a=-Math.PI/2+k*Math.PI/4;p=new Path2D();p.ellipse(cx+Math.cos(a)*116*s,cy+Math.sin(a)*116*s,68*s,38*s,a,0,Math.PI*2);add(p,k%2?2:0,cx+Math.cos(a)*120*s,cy+Math.sin(a)*120*s)}
 p=new Path2D();p.arc(cx,cy,60*s,0,Math.PI*2);add(p,1,cx,cy-40*s);p=new Path2D();p.arc(cx,cy,24*s,0,Math.PI*2);add(p,0,cx,cy);return R}
function drawRegions(g,R,S,dots){for(const r of R){g.fillStyle=r.ok?DC[r.c]:FD[r.c];g.fill(r.p);g.strokeStyle='#2b1d12';g.lineWidth=Math.max(1.5,S/200);g.stroke(r.p)}if(dots)for(const r of R)if(!r.ok){g.beginPath();g.arc(r.hx,r.hy,S/70,0,7);g.fillStyle='#fff';g.fill();g.beginPath();g.arc(r.hx,r.hy,S/100,0,7);g.fillStyle=DC[r.c];g.fill()}}
function drawPanel(g,S,full){const R=panelRegions(S);R.forEach(r=>r.ok=full);drawRegions(g,R,S,false);if(SHOW.painter)SHOW.painter.tex.needsUpdate=true}

  ko:{t:'금동 반가사유상',i:'한쪽 다리를 올리고 손끝을 뺨에 댄 채 깊은 생각에 잠긴 부처예요. 삼국시대 7세기 작품입니다.',h:'국보로 지정되어 서울 국립중앙박물관 사유의 방에서 볼 수 있어요.',f:[['삼국시대 반가사유상 중 최대','높이가 93.5cm로, 삼국시대 반가사유상 가운데 가장 커요.'],['교토의 쌍둥이?','일본 교토 고류지의 나무 반가사유상과 아주 닮아서, 한반도에서 건너갔다는 학설도 있어요.'],['생각하는 자세','영어로는 Pensive, 생각에 잠긴 보살이라고 불러요.']],c:'사진 국립중앙박물관, 공공누리 제1유형'},
  en:{t:'Gilt-bronze Pensive Bodhisattva',i:'A Buddha deep in thought, one leg crossed and a fingertip resting on the cheek. Made in the 7th century, Three Kingdoms period.',h:'A National Treasure, shown in the Room of Quiet Contemplation at the National Museum of Korea in Seoul.',f:[['The biggest of its era','At 93.5 cm, it is the largest pensive bodhisattva from the Three Kingdoms period.'],['A twin in Kyoto?','It looks remarkably like a wooden statue at Koryu-ji temple in Kyoto, and some scholars think that one came from the Korean peninsula.'],['Lost in thought','That pose gives it its English name: pensive.']],c:'Photo: National Museum of Korea, KOGL Type 1'}},

  ko:{t:'백제 금동대향로',i:'산과 신선, 동물과 악사가 빼곡한 향로 꼭대기에 봉황이 앉아 있어요. 백제 금속공예의 정점이에요.',h:'1993년 부여 능산리 절터에서 발굴되어 국립부여박물관에 있어요.',f:[['진흙 속의 보물','1993년 12월 능산리 절터를 발굴하다가 진흙 구덩이 속에서 거의 온전한 모습으로 나왔어요.'],['봉황 아래 밴드','높이 61.8cm. 뚜껑 위 봉황 바로 아래에서 악사 다섯 명이 악기를 연주해요.'],['나만의 전시관','2025년 12월, 국립부여박물관에 이 향로만을 위한 전시관이 열렸어요.']],c:'사진 국립중앙박물관, 공공누리 제1유형'},
  en:{t:'Gilt-bronze Incense Burner of Baekje',i:'Mountains, immortals, animals and musicians crowd its surface, with a phoenix on top. The peak of Baekje metalwork.',h:'Excavated at a temple site in Buyeo in 1993, it is now at Buyeo National Museum.',f:[['Treasure in the mud','In December 1993 it was found almost intact in a muddy pit at the Neungsan-ri temple site.'],['A band under the phoenix','It stands 61.8 cm tall. Right under the phoenix, five musicians play their instruments.'],['A hall of its own','In December 2025 Buyeo National Museum opened a hall just for this incense burner.']],c:'Photo: National Museum of Korea, KOGL Type 1'}},

  ko:{t:'백자 달항아리',i:'보름달처럼 둥글고 우윳빛이 도는 조선 18세기 백자 항아리예요.',h:'1975년 해리 패커드 컬렉션에서 기증과 매입으로 뉴욕 메트로폴리탄미술관에 들어갔어요.',f:[['반쪽 두 개를 붙였어요','한 번에 빚기엔 너무 커서 위아래 반구를 따로 빚어 가운데서 붙였어요. 그래서 허리에 이음선이 있고 모양이 조금씩 달라요.'],['원래 이름은 큰 항아리','조선시대엔 그냥 큰 항아리라고 부르던 살림 그릇이었어요.'],['런던에도 있어요','영국 대영박물관에도 유명한 달항아리가 있어요. 그래서 퀴즈가 헷갈리죠?']],c:'사진 메트로폴리탄미술관, CC0'},
  en:{t:'Moon Jar',i:'A milky white Joseon porcelain jar from the 18th century, round like a full moon.',h:'It entered The Met in 1975 as a gift and purchase from the Harry G. C. Packard Collection.',f:[['Two halves make a moon','Too big to throw in one piece, it was made as two bowls joined at the middle. That is why each moon jar has a seam and a slightly different shape.'],['Just a big jar','In the Joseon period it was simply called a big jar and used for storage.'],['There is one in London too','The British Museum has a famous moon jar as well, which makes this quiz a little tricky.']],c:'Photo: The Metropolitan Museum of Art, CC0'}},

  en:{t:'Bamboo-shoot Celadon Ewer',i:'A 12th-century Goryeo celadon wine ewer shaped like a young bamboo shoot.',h:'Dr Alfred Ludlow of Cleveland sold it to John L. Severance, who gave it to The Cleveland Museum of Art.',f:[['Bamboo or lotus?','It is a bamboo shoot, but from some angles it looks like a lotus bud.'],['Three siblings','Ewers of the same shape are also in Seoul and at the Museum of Oriental Ceramics in Osaka.'],['It really needed restoring','It once had a matching lid, now lost, and the spout has been repaired.']],c:'Photo: The Cleveland Museum of Art, CC0'}},
