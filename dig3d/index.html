 if(c.piece>=0&&c.d===c.pd&&!ST[c.s.k].got.includes(c.piece)){const g=shardModel(c.s.k);g.position.set(c.x+.5,cellTop(c)+.06,c.z+.5);g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.userData.base=o.material.color.clone();o.material.color.set(0x5a4430)}});scene.add(g);FOUND.push({c,m:g,brush:0});hint(`${c.s.front}… 흙 속에 무언가 있어요! 붓으로 살살 털어 봐요.`,4500)}}
function brushFound(F){F.brush++;sfx('brush');dust(F.m.position.x,F.m.position.y+.05,F.m.position.z,'#d8c8a8');const k=F.brush/3;F.m.traverse(o=>{if(o.isMesh)o.material.color.copy(new THREE.Color(0x5a4430).lerp(o.userData.base,k))});me.play('brush',.15);clearTimeout(brushFound.t);brushFound.t=setTimeout(()=>me.play('idle',.3),700);
 if(F.brush>=3){const s=F.c.s,n=s.pieces[F.c.piece];sfx('ding');hint(`찾았다! ${n}. ${s.name}에서 ${ST[s.k].got.length+1}/${s.pieces.length}번째 조각이에요.`,5000);beam(F.m.position);cheer();F.ready=true}}
function pickFound(F){const s=F.c.s;ST[s.k].got.push(F.c.piece);save();scene.remove(F.m);FOUND.splice(FOUND.indexOf(F),1);sfx('tick');progUI();if(ST[s.k].got.length>=s.pieces.length){hint(`${s.name}의 조각을 모두 모았어요! 광장 복원대에서 맞춰 봐요.`+(s.k==='fort'&&ST.fort.wall<3?' 무너진 성벽도 다시 쌓아야 해요.':''),7000)}}
/* 먼지·빛줄기 */const DUST=(()=>{const N=80,g=new THREE.BufferGeometry(),p=new Float32Array(N*3).fill(-99),v=[];for(let i=0;i<N;i++)v.push([0,0,0,0]);g.setAttribute('position',new THREE.BufferAttribute(p,3));const mt=new THREE.PointsMaterial({color:0x8a6a44,size:.07,transparent:true,depthWrite:false});const m=new THREE.Points(g,mt);scene.add(m);return{p,v,g,N,mt}})();
function dust(x,y,z,col){DUST.mt.color.set(col);let k=0;for(let i=0;i<DUST.N&&k<16;i++){if(DUST.v[i][3]>0)continue;DUST.p[i*3]=x;DUST.p[i*3+1]=y;DUST.p[i*3+2]=z;DUST.v[i]=[(Math.random()-.5)*1.6,1+Math.random()*1.2,(Math.random()-.5)*1.6,.8+Math.random()*.4];k++}}
TICK.push(dt=>{for(let i=0;i<DUST.N;i++){const v=DUST.v[i];if(v[3]<=0)continue;v[3]-=dt;v[1]-=dt*4;DUST.p[i*3]+=v[0]*dt;DUST.p[i*3+1]+=v[1]*dt;DUST.p[i*3+2]+=v[2]*dt;if(v[3]<=0)DUST.p[i*3+1]=-99}DUST.g.attributes.position.needsUpdate=true});
function beam(p){const b=new THREE.Mesh(new THREE.CylinderGeometry(.25,.6,8,16,1,true),new THREE.MeshBasicMaterial({color:0xfff0b0,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));b.position.set(p.x,p.y+4,p.z);scene.add(b);let t=0;TICK.push(function f(dt){t+=dt;b.material.opacity=.45*Math.max(0,1-t/3);b.rotation.y+=dt;if(t>3){scene.remove(b);TICK.splice(TICK.indexOf(f),1)}})}
/* ---------- 동료 무이: 지금 유적에서 같이 판다 ---------- */
const CREW=[];const JOBS=['dig','brush','magnify','carry','look_up'];
async function placeCrew(){const kinds=['carpenter','ceramic','science','metal','painter'];for(let i=0;i<5;i++){const m=await makeMuui(kinds[i],.95);m.i=i;m.root.position.set(-3+i*1.5,0,9);m.play('idle',0);CREW.push(m)}}
let curSite=null,cheerT=0;function cheer(){cheerT=2.2}
function crewTick(dt){let s=null,bd=14;for(const q of SITES){const d=Math.hypot(pos.x-q.c[0],pos.z-q.c[1]);if(d<bd){bd=d;s=q}}if(s!==curSite){curSite=s;if(s)hint(`${s.name}: ${s.sub}. 칸 앞에 서서 '파기'를 눌러요.`,5000);progUI()}cheerT-=dt;
 CREW.forEach((m,i)=>{let tx,tz,face=null;if(s){const x0=s.x0,z0=s.z0,W=s.cols,H=s.rows;const spots=[[x0-.7,z0+H*.3],[x0+W+.7,z0+H*.6],[x0+W*.3,z0+H+.7],[x0+W*.75,z0+H+.7],[x0+W*.5,z0-.8]];[tx,tz]=spots[i];face=Math.atan2(s.c[0]-tx,s.c[1]-tz)}else{tx=-3+i*1.5;tz=9}
  const q=m.root.position,dx=tx-q.x,dz=tz-q.z,d=Math.hypot(dx,dz);if(d>.12){const sp=Math.min(d,dt*(d>4?3.2:1.6));q.x+=dx/d*sp;q.z+=dz/d*sp;m.root.rotation.y=Math.atan2(dx,dz);m.play(d>4?'run':'walk',.25)}else{if(face!=null){let r=face-m.root.rotation.y;r=Math.atan2(Math.sin(r),Math.cos(r));m.root.rotation.y+=r*Math.min(1,dt*5)}m.play(cheerT>0?(NOARM[m.k]?'clap':'cheer'):s?JOBS[i]:'idle',.3)}
  q.y+=(groundY(q.x,q.z)-q.y)*Math.min(1,dt*10);m.mx.update(dt)})}
/* ---------- 복원대: 실제 사진 조각 맞추기 ---------- */
let PZ=null;const pzc=$('#pzc'),pg=pzc.getContext('2d');
function openPuzzle(s){const im=new Image();im.onload=()=>{const[cols,rows]=s.grid,S=600,r=Math.min(440/im.width,440/im.height),w=im.width*r,h=im.height*r,ax=(S-w)/2,ay=(S-h)/2-30,pw=w/cols,ph=h/rows,P=[];for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const tx=ax+i*pw+pw/2,ty=ay+j*ph+ph/2;P.push({i,j,tx,ty,x:60+Math.random()*480,y:470+Math.random()*90,ok:false})}PZ={s,im,P,pw,ph,ax,ay,w,h,cols,rows,drag:null};$('#pzT').textContent=`${s.card.replace(' 복원 완료','')} 맞추기`;$('#pz').hidden=false;pzDraw()};im.src=s.photo}
function pzDraw(){const Z=PZ;pg.fillStyle='#efe7d6';pg.fillRect(0,0,600,600);pg.globalAlpha=.16;pg.drawImage(Z.im,Z.ax,Z.ay,Z.w,Z.h);pg.globalAlpha=1;pg.setLineDash([7,6]);pg.strokeStyle='rgba(59,42,28,.5)';for(const p of Z.P)if(!p.ok)pg.strokeRect(p.tx-Z.pw/2,p.ty-Z.ph/2,Z.pw,Z.ph);pg.setLineDash([]);
 for(const p of[...Z.P.filter(q=>q.ok),...Z.P.filter(q=>!q.ok&&q!==Z.drag),...(Z.drag?[Z.drag]:[])]){const sw=Z.im.width/Z.cols,sh=Z.im.height/Z.rows;pg.save();if(!p.ok){pg.shadowColor='rgba(0,0,0,.35)';pg.shadowBlur=12}pg.drawImage(Z.im,p.i*sw,p.j*sh,sw,sh,p.x-Z.pw/2,p.y-Z.ph/2,Z.pw,Z.ph);if(!p.ok){pg.shadowColor='transparent';pg.strokeStyle='#fff';pg.lineWidth=3;pg.strokeRect(p.x-Z.pw/2,p.y-Z.ph/2,Z.pw,Z.ph)}pg.restore()}}
const pzp=e=>{const r=pzc.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
pzc.addEventListener('pointerdown',e=>{if(!PZ)return;pzc.setPointerCapture(e.pointerId);const[x,y]=pzp(e);for(let i=PZ.P.length-1;i>=0;i--){const p=PZ.P[i];if(!p.ok&&Math.abs(x-p.x)<PZ.pw/2&&Math.abs(y-p.y)<PZ.ph/2){PZ.drag=p;p.ox=p.x-x;p.oy=p.y-y;break}}});
pzc.addEventListener('pointermove',e=>{if(!PZ||!PZ.drag)return;const[x,y]=pzp(e);PZ.drag.x=x+PZ.drag.ox;PZ.drag.y=y+PZ.drag.oy;pzDraw()});
pzc.addEventListener('pointerup',()=>{if(!PZ||!PZ.drag)return;const p=PZ.drag;PZ.drag=null;if(Math.hypot(p.x-p.tx,p.y-p.ty)<55){p.x=p.tx;p.y=p.ty;p.ok=true;sfx('tick')}pzDraw();if(PZ.P.every(q=>q.ok)){const s=PZ.s;sfx('ding');setTimeout(()=>{$('#pz').hidden=true;PZ=null;ST[s.k].done=true;save();showCard(s)},500)}});
$('#pzX').addEventListener('click',()=>{$('#pz').hidden=true;PZ=null});
function showCard(s){$('#cImg').src=s.photo;$('#cT').textContent=s.card;$('#cI').textContent=s.intro;const F=$('#cF');F.innerHTML='';for(const[a,b]of s.facts){const d=document.createElement('div'),h=document.createElement('b'),sp=document.createElement('span');h.textContent=a;sp.textContent=b;d.append(h,sp);F.appendChild(d)}$('#cN').textContent=s.note;$('#cC').textContent=s.credit;$('#card').hidden=false}
$('#cX').addEventListener('click',()=>{$('#card').hidden=true;caseUI();cheer();const n=SITES.filter(s=>ST[s.k].done).length;hint(n>=3?'세 유적을 모두 복원해 진열장이 가득 찼어요! 무이 발굴단의 명예 단원이에요.':`진열장에 올렸어요. (${n}/3) 다른 유적도 파 봐요.`,6000)});
const PHOTO={};function caseUI(){for(const C of CASES){C.slot.clear();const s=C.s;if(ST[s.k].done){const m=relicModel(s.k,true);m.scale.setScalar(1.25);m.position.y=.08;C.slot.add(m);const t=PHOTO[s.k]||(PHOTO[s.k]=new THREE.TextureLoader().load(s.photo,x=>{x.colorSpace=THREE.SRGBColorSpace}));const ph=new THREE.Mesh(new THREE.PlaneGeometry(.8,.8),new THREE.MeshBasicMaterial({map:t}));ph.position.set(0,.45,-.36);C.slot.add(ph)}else{for(const i of ST[s.k].got){const m=shardModel(s.k);m.position.set(-.4+i*.2,-.05,0);m.scale.setScalar(.8);C.slot.add(m)}}}}
/* ---------- 진행판 ---------- */
function progUI(){const P=$('#prog');P.hidden=!me;P.innerHTML='<b>발굴 일지</b>'+SITES.map(s=>{const g=ST[s.k].got.length,n=s.pieces.length;const extra=s.k==='fort'?` · 성벽 ${ST.fort.wall}/3`:'';return`<div class="r ${ST[s.k].done?'ok':''}"><span>${s===curSite?'▶ ':''}${s.name}</span><span>${ST[s.k].done?'복원 완료':`조각 ${g}/${n}${extra}`}</span></div>`}).join('')}
/* ---------- 버튼: 가까운 일 ---------- */
let actFn=null;$('#act').addEventListener('click',()=>{audio();actFn&&actFn()});
function uiTick(){const a=$('#act');a.hidden=true;actFn=null;if(!me||PZ||!$('#card').hidden)return;
 for(const F of FOUND){if(Math.hypot(pos.x-F.m.position.x,pos.z-F.m.position.z)<1.6){if(F.ready){a.textContent=`${F.c.s.pieces[F.c.piece]} 줍기`;actFn=()=>pickFound(F)}else{a.textContent=`붓으로 털기 (${F.brush}/3)`;actFn=()=>brushFound(F)}a.hidden=false;return}}
 const c=frontCell();if(c&&!(c.piece>=0&&c.d>=c.pd&&!ST[c.s.k].got.includes(c.piece)&&FOUND.some(F=>F.c===c))){a.textContent=`파기 (${c.d}/${DEPTH}층)`;actFn=()=>digCell(c);a.hidden=false;return}
 const F=SITES[2];if(ST.fort.got.length>=3&&ST.fort.wall<3&&Math.hypot(pos.x-F.gap[0]+1.2,pos.z-F.gap[1])<2.4){a.textContent=`무너진 성벽에 돌 쌓기 (${ST.fort.wall}/3)`;actFn=()=>{F.gapStones[ST.fort.wall].visible=true;ST.fort.wall++;save();sfx('thud');dust(F.gap[0],.3+ST.fort.wall*.7,F.gap[1],'#9a948a');progUI();if(ST.fort.wall>=3){cheer();hint('성벽을 다시 쌓았어요! 이제 수막새를 맞춰 봐요.',5000)}};a.hidden=false;return}
 if(Math.hypot(pos.x-BENCH.x,pos.z-BENCH.z)<2.4){const ready=SITES.find(s=>ST[s.k].got.length>=s.pieces.length&&!ST[s.k].done&&(s.k!=='fort'||ST.fort.wall>=3));if(ready){a.textContent=`복원대: ${ready.card.replace(' 복원 완료','')} 맞추기`;actFn=()=>openPuzzle(ready)}else{a.textContent='복원대';actFn=()=>hint('조각을 다 모은 유적이 생기면 여기서 실제 사진으로 맞춰요.',4000)}a.hidden=false;return}
 for(const C of CASES)if(Math.hypot(pos.x-C.x,pos.z-C.z)<1.2){a.textContent=`${C.s.name} 진열장`;actFn=()=>{if(ST[C.s.k].done)showCard(C.s);else hint(`${C.s.name}: 조각 ${ST[C.s.k].got.length}/${C.s.pieces.length}. 다 모아 복원하면 여기 올라와요.`,4000)};a.hidden=false;return}
 if(Math.hypot(pos.x,pos.z-17)<2.4){a.textContent='무이 월드 3D로 돌아가기';actFn=()=>{location.href='../world3d/?from=dig3d'};a.hidden=false}}
$('#bWorld').addEventListener('click',()=>{location.href='../world3d/?from=dig3d'});
/* ---------- 시작 ---------- */
const PICK=[{k:'base',n:'무이'},{k:'ceramic',n:'도공 무이'},{k:'science',n:'과학 무이'},{k:'carpenter',n:'목수 무이'},{k:'painter',n:'화공 무이'},{k:'metal',n:'금속 무이'}];
let pickK=(()=>{try{return localStorage.getItem('muui3d-kind')}catch(e){}})()||'base';
{const bx=$('#kinds');for(const q of PICK){const b=document.createElement('button');b.type='button';b.innerHTML=`<img alt="" src="../world3d/media/pick_${q.k}.jpg"><b>${q.n}</b>`;b.classList.toggle('on',q.k===pickK);b.addEventListener('click',()=>{pickK=q.k;bx.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});bx.appendChild(b)}}
$('#go').addEventListener('click',async()=>{audio();try{localStorage.setItem('muui3d-kind',pickK)}catch(e){}$('#pick').hidden=true;$('#load').hidden=false;$('#load').style.opacity=1;me=await makeMuui(pickK,1);me.play('idle',0);await placeCrew();caseUI();
 /* 이미 판 칸·주운 조각 되살리기 */for(const s of SITES)for(const c of s.cells)if(c.piece>=0&&ST[s.k].got.includes(c.piece)){c.d=c.pd;cellMesh(c)}for(let i=0;i<ST.fort.wall;i++)SITES[2].gapStones[i].visible=true;
 $('#load').style.opacity=0;setTimeout(()=>$('#load').hidden=true,600);$('#top').hidden=false;progUI();if(matchMedia('(pointer:coarse)').matches)$('#stick').hidden=false;
 hint('무이 발굴단 3D! 북서쪽 신라 고분, 북동쪽 호수 침몰선, 북쪽 산성. 동료 무이들이 따라와 같이 파요.',8000)});
if(new URLSearchParams(location.search).get('from')==='world3d'){}
setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>{$('#load').hidden=true;$('#pick').hidden=false},500)},600);
/* ---------- 프레임 ---------- */
let last=performance.now(),uiT=0;const tmp=new THREE.Vector3();
R.setAnimationLoop(()=>{try{frame()}catch(e){console.error(e)}});
function frame(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
 if(me){let fx=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),sx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(stickId!==null){fx=-stickV.y;sx=stickV.x}if(PZ||!$('#card').hidden){fx=sx=0}
  const mag=Math.min(1,Math.hypot(fx,sx)),run=keys.ShiftLeft||keys.ShiftRight||(stickId!==null&&mag>.85);speed+=((mag>.05?(run?4.2:1.8):0)-speed)*Math.min(1,dt*8);
  if(mag>.05){const a=camYaw+Math.PI-Math.atan2(sx,fx);let d=a-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*Math.min(1,dt*10)}
  const ox=pos.x,oz=pos.z,oy=groundY(pos.x,pos.z);pos.x+=Math.sin(yaw)*speed*dt;pos.z+=Math.cos(yaw)*speed*dt;collide();
  /* 한 번에 두 층(50cm) 넘게는 못 오른다 */if(groundY(pos.x,pos.z)-oy>1.1){pos.x=ox;pos.z=oz}
  const gy=groundY(pos.x,pos.z);me.root.position.x=pos.x;me.root.position.z=pos.z;me.root.position.y+=(gy-me.root.position.y)*Math.min(1,dt*12);me.root.rotation.y=yaw;
  if(!(me.cur&&(me.cur===me.A.dig||me.cur===me.A.brush)&&speed<.3))me.play(speed>3?'run':speed>.25?'walk':'idle',.25);me.mx.update(dt);
  const ty=me.root.position.y+1;tmp.set(pos.x+Math.sin(camYaw)*Math.cos(camPitch)*camDist,ty+Math.sin(camPitch)*camDist,pos.z+Math.cos(camYaw)*Math.cos(camPitch)*camDist);cam.position.lerp(tmp,Math.min(1,dt*8));cam.lookAt(pos.x,ty,pos.z)}
 else{const t=now/1000*.05;cam.position.set(Math.sin(t)*34,14,5+Math.cos(t)*34);cam.lookAt(0,0,-8)}
 crewTick(dt);for(const f of TICK.slice())f(dt);uiT-=dt;if(uiT<=0){uiT=.15;uiTick()}R.render(scene,cam)}
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
