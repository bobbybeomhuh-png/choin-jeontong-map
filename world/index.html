 c:{metal:'금속 무이',ceramic:'도공 무이',painter:'화공 무이',carpenter:'목수 무이',science:'과학 무이'},
 ask:{metal:['어서 와요! 저는 금속을 고치는 무이예요.','흙 속에서 나온 신라 금관이 녹과 흙에 덮여 있어요. 같이 털어 주실래요?'],ceramic:['저는 깨진 도자기를 잇는 무이예요.','바닷속에서 건진 고려 청자가 조각났어요. 같이 맞춰 볼래요?'],painter:['저는 단청을 칠하는 무이예요.','이 보 끝의 무늬가 바래서 거의 안 보여요. 같이 색을 되찾아 줄래요?']},

 r:{metal:{t:'신라 금관 복원 완료',i:'방금 손질한 금관의 실제 모습이에요. 1500년 전 신라 무덤 주인이 쓰던 천마총 금관입니다. 지금은 국립경주박물관에 있어요.',f:[['연습이었는데요?','천마총은 더 큰 황남대총을 파기 전에 연습 삼아 시작한 무덤이었다고 해요. 거기서 금관이 나와 버렸습니다.'],['그날 오후','1973년 7월 26일 늦은 오후, 발굴 석 달여 만에 무덤 주인의 머리 부근에서 모습을 드러냈어요.'],['이름의 주인공','천마총이라는 이름은 함께 나온 하늘을 나는 말 그림에서 왔어요. 이 무덤의 유물은 1만 점이 넘습니다.']],c:'사진 국립중앙박물관, 공공누리 제1유형',n:'게임 속 복원 과정은 놀이를 위한 연출이며 실제 보존 처리와 다릅니다.'},
  ceramic:{t:'고려 청자 매병 복원 완료',i:'구름 사이를 나는 학을 새겨 넣은 고려 청자 매병이에요. 사진 속 병은 지금 미국 메트로폴리탄미술관에 있습니다.',f:[['주꾸미가 찾은 보물선','2007년 태안 앞바다에서 잡힌 주꾸미 한 마리가 청자 접시를 끌어안고 올라왔어요. 신고 끝에 고려 배가 발견되었고, 유물 2만 점 넘게 건져 올렸습니다.'],['이 귀한 병에 참기름을?','태안 마도 2호선에서 나온 매병 목에 대나무 꼬리표가 달려 있었어요. 받는 사람 이름과 함께 참기름, 꿀이라고 적혀 있었답니다. 고려판 택배 송장이죠.'],['고려의 인기 무늬','구름과 학은 고려청자에서 사랑받은 무늬예요. 국보 청자 상감운학문 매병은 간송미술관에 있습니다.']],c:'사진 메트로폴리탄미술관, CC0',n:'게임 속 복원 과정은 놀이를 위한 연출이며 실제 보존 처리와 다릅니다.'},
  painter:{t:'단청 머리초 복원 완료',i:'나무 건물의 기둥과 보에 칠하는 화려한 무늬를 단청이라고 해요. 방금 칠한 건 보 끝에 그리는 머리초를 단순하게 옮긴 무늬예요.',f:[['다섯 가지 색','단청은 청, 적, 황, 백, 흑의 오방색을 바탕으로 칠해요. 나무를 비바람과 벌레로부터 지키는 역할도 했답니다.'],['머리초','기둥이나 보의 끝부분에 그리는 무늬를 머리초라고 해요. 연꽃 무늬가 대표적이에요.'],['색의 장인','단청을 그리는 장인을 단청장이라고 해요. 단청장은 국가무형유산으로 지정되어 있습니다.']],c:'무늬 그림 무이 복원 마당',n:'게임 속 무늬는 단청 머리초를 단순하게 그린 연출입니다.'}}},
 en:{title:'MUUI MADANG',sub:'Restore Korean treasures, rest in a hanok courtyard.',g1:'Walk up to a Muui restorer and mend a treasure together, one brushstroke at a time.',g2:'Sit on the wooden porch, by the brazier or the pond. Doing nothing is fine here.',g3:'Every night at 9 PM Korea time, we light the courtyard lanterns together.',g4:'No sign-up, no chat. Everyone who opens this link shares the same courtyard.',howPC:'WASD to walk · drag to look around · buttons below to jump to a spot',howTouch:'Left circle to walk · drag to look around · buttons below to jump to a spot',enter:'Enter the courtyard',again:'Back to the courtyard',menu:'Menu',invite:'Invite',help:'Guide',soundOn:'Sound on',soundOff:'Sound off',pMap:'Map',atlasT:"Muui's World Map",atlasSub:'{0} of {1} treasures restored. Korean treasures now live all over the world.',story:'Story',see:'View',restored:'{0}, restored',quizQ:'Where is this treasure today?',quizOk:'Correct!',quizNo:'Not quite. The right answer is in green.',nowAt:'Now at {0}, {1}',nextJob:'Next job: {0}. Shall we?',aYut:'Throw yut sticks',yut:{do:'<b>Do!</b> One step. In yutnori, do stands for a pig.',gae:'<b>Gae!</b> Two steps. Gae is a dog.',geol:'<b>Geol!</b> Three steps. Geol stands for a sheep.',yut:'<b>Yut!</b> Four steps and you throw again. It stands for a cow.',mo:'<b>Mo!</b> Five steps and another throw! The horse, the best throw of all.'},info:{sotdae:['Sotdae · raised by Carpenter Muui','People believed the wooden birds on top carried the village\'s wishes up to the sky.'],jangseung:['Jangseung · carved by Carpenter Muui','Guardian posts at the village entrance that keep bad luck away. They come as a pair, a great general above and a female general below.'],pyeong:['Pyeongsang · built by Carpenter Muui','A wooden platform where neighbours sat together on summer nights. Sit down and throw the yut sticks.'],jang:['Jangdokdae · onggi jars by Potter Muui','Clay jars for soy sauce, doenjang and gochujang. Onggi breathes, so the sauces ferment slowly and well.'],ondol:['Ondol chimney · fixed by Science Muui','A fire in the stove sends hot smoke under the stone floor to warm the room. That is ondol, Korean underfloor heating.'],chorong:['Cheongsa chorong · silk by Painter Muui','Blue above, red below. Lanterns lit for weddings and honoured guests.'],punggyeong:['Punggyeong · fish bell by Metal Muui','The fish under the eaves never closes its eyes, a reminder to stay awake and mindful.'],pond:['Square pond, round island','It reflects the old idea that the sky is round and the earth is square. Buyongji pond at Changdeokgung Palace has the same shape.'],gam:['Persimmon tree · kkachi-bap','A few persimmons are always left on the tree for winter birds. They are called magpie food.']},aTea:'Sip some tea',aWood:'Add firewood',aFeed:'Feed the ducks',lTea:['Warm barley tea. Take your time.','Listen to the wind chime under the eaves.','A breeze drifts through the courtyard.','You did well today.'],lWood:['Crackle. The wood catches.','Sparks drift up into the sky.','Warm your hands by the fire.'],lFeed:['The mandarin ducks paddle over. In Korea they stand for lifelong partners, so carved wooden ducks are given at traditional weddings.','Rings spread across the water.','The colourful one is the male; the quieter one is the female.'],pBench:'Restore',pMaru:'Porch',pFire:'Brazier',pPond:'Pond',pBow:'Bow',sit:'Sit',stand:'Stand up',close:'Close',back:'Back to the courtyard',postcard:'Save postcard',talk:'Restore with {0}',talk2:'Talk to {0}',yes:"Let's do it",later:'Later',ok:'OK',next:'Next',pin:'Restore here',tag:'Restorer {0}',joined:'<b>Restorer {0}</b> entered the courtyard',bowed:'<b>Restorer {0}</b> bowed',youBow:'A small bow to everyone in the courtyard.',lIn:'Lanterns in {0}',lOn:'Lanterns are lit',lMsg:'<b>The lanterns are being lit.</b> {0} treasures were restored in this courtyard today.',lMsg0:'<b>The lanterns are being lit.</b> Be the first to restore a treasure today.',online:'{0} online',copied:'<b>Link copied.</b> Friends who open it join this courtyard, no sign-up.',sendUrl:'Share this link: {0}',first:'Walk to the restorer with the gold marker, or tap <b>Restore</b> below.',seatHint:'Take your time. Move to stand up.',wrong:'This area takes another colour. Match the small dot inside it.',nogl:'3D is not available on this device',stepOf:'Step {0} of {1}',

 ask:{metal:["Welcome! I'm Muui, and I mend metal.","This Silla gold crown came out of the earth covered in soil and rust. Will you help me clean it?"],ceramic:["I'm Muui, and I join broken pottery.","This Goryeo celadon vase came up from the sea in pieces. Shall we put it back together?"],painter:["I'm Muui, and I paint dancheong.","The pattern at the end of this beam has faded away. Will you help bring its colours back?"]},
 again:{metal:'You came back! Another crown piece just arrived. One more time?',ceramic:'New shards came up from the sea. Want to piece them together again?',painter:'The next beam has faded too. Paint it with me?'},
 soon:{carpenter:"I'm Carpenter Muui. I'm getting a lattice-door job ready. Let's do it together soon!",science:"I'm Science Muui. I'm preparing a job to scan Korean treasures held abroad and bring them home digitally."},
 thanks:'Thank you! The others are waiting for you too.',allDone:"You've helped all three restorers! Rest in the courtyard now. The lanterns come on at 9 PM Korea time.",
 steps:{rust:['Brush off soil and rust','Rub over the treasure with the brush to clear away soil and rust.'],fit3:['Fit the pieces','Drag each scattered piece back into place.'],fitRot:['Fit the shards','Tap a shard to turn it. Once it stands upright, drag it into place.'],seam:['Fill the cracks','Rub along the cracks to fill them with fine clay.'],dust:['Dust it off','Sweep with the brush to reveal the faded pattern.'],dustP:['Dust the painting','Sweep the brush gently over the painting to lift the dust.'],fitP:['Mend the tears','Drag each torn piece of the painting back into place.'],paint:['Bring back the colour','Pick a colour below, then tap each area that has a dot of the same colour.']},
 pal:['Vermilion','Green','Yellow','Blue'],
 r:{metal:{t:'Silla gold crown, restored',i:'This is the real crown you just cleaned. It belonged to a Silla ruler about 1,500 years ago and was found in the Cheonmachong tomb. Today it is at Gyeongju National Museum.',f:[['It was only practice','Cheonmachong was excavated as a warm-up before the much larger Hwangnamdaechong tomb. Then a gold crown turned up.'],['That afternoon','Late in the afternoon of 26 July 1973, about three months into the dig, it appeared near the head of the person buried there.'],['Where the name comes from','Cheonmachong means Tomb of the Heavenly Horse, after a painting of a flying horse found inside. The tomb held more than 10,000 objects.']],c:'Photo: National Museum of Korea, KOGL Type 1',n:'The restoration here is playful and differs from real conservation work.'},
  ceramic:{t:'Goryeo celadon vase, restored',i:'A Goryeo celadon maebyeong vase inlaid with cranes flying through clouds. The one in the photo is at The Metropolitan Museum of Art in New York.',f:[['Found by an octopus','In 2007 an octopus caught off Taean came up clinging to a celadon dish. That led to a sunken Goryeo ship and more than 20,000 artifacts.'],['Sesame oil in a vase this fine?','Vases from the Mado No. 2 shipwreck still had bamboo tags with the receiver\'s name and the words sesame oil and honey. A Goryeo shipping label.'],['A favourite pattern','Clouds and cranes were a beloved Goryeo celadon motif. A famous national treasure with this design is at the Kansong Art Museum in Seoul.']],c:'Photo: The Metropolitan Museum of Art, CC0',n:'The restoration here is playful and differs from real conservation work.'},
  painter:{t:'Dancheong pattern, restored',i:'Dancheong is the bright painting on the beams and pillars of Korean wooden buildings. What you painted is a simplified meoricho, the motif painted at the end of a beam.',f:[['Five colours','Dancheong is built on five traditional colours: blue, red, yellow, white and black. The paint also protected the wood from rain and insects.'],['Meoricho','The motif at the end of a beam or pillar is called meoricho. Lotus flowers are one of the most common designs.'],['Masters of colour','The artisans who paint dancheong are called dancheongjang. The craft is designated as a National Intangible Heritage of Korea.']],c:'Pattern drawing: MUUI MADANG',n:'The pattern is a simplified illustration.'}}}};
Object.assign(STR.ko,{wkTitle:'달항아리 복원 현장',wkCount:'{0} / 20곳 완료',wkAllDone:'복원 완료! 곧 다음 항아리가 들어와요.',wkWait:'복원단이 다음 작업을 준비하고 있어요.',wkBtn:'같이 작업하기: {0}',wkPick:'먼저 주변 유약과 가장 비슷한 색을 고르세요.',wkWrong:'주변보다 튀어요. 다른 색을 골라 보세요.',wkS:[{t:'조사',how0:'돋보기로 금의 길이와 갈래를 살피고 있어요.',how:'금을 따라 금빛 점을 끌어 표시해요.',why:'손대기 전에 금이 어디서 어디까지 갔는지 먼저 기록해요. 그래야 작업 뒤와 비교할 수 있어요.',talk:['여기서 두 갈래로 갈라지네','이 금은 전에 없던 거야','기록부터 하자']},{t:'세척',how0:'면봉으로 틈의 묵은 때를 닦고 있어요.',how:'문질러서 틈 주변의 때를 닦아요.',why:'에탄올 묻힌 면봉으로 틈의 때를 닦아요. 더러운 면에는 접착제가 제대로 붙지 않아요.',talk:['면봉 하나 더 줘','때가 꽤 깊어','살살, 유약 다칠라']},{t:'접합',how0:'금 사이로 접착제를 조금씩 넣고 있어요.',how:'금을 따라 천천히 접착제를 넣어요.',why:'도자기 수리에는 아크릴 수지 Paraloid B-72가 널리 쓰여요. 세월이 지나도 용제로 풀 수 있어서 다시 되돌릴 수 있어요.',talk:['조금만, 넘치면 안 돼','틈으로 스며드는 거 봐','숨 참아']},{t:'충전',how0:'갈라지고 떨어진 자리를 메우고 있어요.',how:'금을 따라 충전재를 채워요.',why:'떨어져 나간 자리는 충전재로 메워요. 수지에 실리카, 카올린 같은 고운 가루와 안료를 섞어 만들기도 해요.',talk:['반죽 더 필요해','이 자리 좀 깊다','너무 도톰해']},{t:'정형',how0:'메운 자리를 주변과 같은 높이로 갈고 있어요.',how:'문질러서 표면을 고르게 갈아요.',why:'굳은 뒤 주변 높이에 맞춰 곱게 다듬어요. 원래 유약에 흠이 나지 않게 메운 자리만 살살 갈아요.',talk:['손끝으로 만져 봐','거의 다 맞았어','아직 턱이 있어']},{t:'색맞춤',how0:'메운 자리의 색과 광택을 맞추고 있어요.',how:'메운 자리를 칠해서 주변과 같은 색으로 만들어요.',why:'메운 자리만 색과 광택을 주변에 맞춰요. 멀쩡한 원래 표면까지 덮지 않는 게 원칙이에요.',talk:['조금 더 따뜻한 색','원본은 건드리지 마','이제 안 보이네']}],fix:{t:'이 자리, 당신이 복원했어요',i:'방금 한 순서가 실제 도자기 복원의 큰 흐름이에요. 조사, 세척, 접합, 충전, 다듬기, 색맞춤. 나머지 자리는 복원단이 계속 작업 중이에요.',f:[['왜 되돌릴 수 있어야 할까','더 좋은 방법이 나오면 다시 고칠 수 있어야 해요. 그래서 복원 재료는 나중에 풀어낼 수 있는 것을 고르려고 해요.'],['왜 메운 자리만 칠할까','복원한 자리가 원래 유물을 가리면 안 돼요. 메운 자리까지만 주변에 맞춰요.'],['옛날 재료의 문제','에폭시는 튼튼하지만 시간이 지나면 누렇게 변해요. 그래서 연구자들이 황변이 적은 재료를 계속 찾고 있어요.']],c:'사진: The Metropolitan Museum of Art, CC0',n:'게임이라 단순화했어요. 실제 처리는 유물 상태와 보존가의 판단에 따라 달라요.'},title:'무이 월드',sub:'쇼츠로 본 유물을 직접 만들어 보고, 불 앞에서 쉬다 가세요.',g1:'회랑을 걸으며 쇼츠를 보고, 바로 옆에서 그 유물을 작업하는 무이들과 함께해요.',g2:'마당 공방에서 복원단을 도와 유물 열 점을 되살리고, 물레로 달항아리도 빚어요.',g3:'가마 불 앞이나 연못가에 앉아 멍하니 쉬어도 좋아요.',g4:'가입 없이, 같은 주소로 들어온 사람은 같은 곳에서 만나요.',enter:'월드에 들어가기',pBench:'복원 현장',market:'무이 장터 · 곧 열려요',pFire:'가마 불멍',pPond:'연못',pMaru:'복원대',benchTag:'복원대',fp1:'1인칭 (V)',areaN:'마당',go:{pbT:'포탈 · 전주 팔복 상영관',pbD:'팔복예술공장 골목에서 티켓을 받아 D-CUBE에 들어가 「뺄불통가마」를 봐요',digT:'포탈 · 발굴 터',digD:'고분, 호수 밑 침몰선, 산성에서 유물 조각을 파내 복원해요',go:'이동하기',out:'다른 구역으로',inn:'무이 월드 안에서',jar:'달항아리 복원 현장',bench:'복원대',wheel:'물레',fire:'가마 불멍',pond:'연못'},fp3:'3인칭 (V)',port:{dig:'발굴 터로 들어가기',palbok:'전주 팔복 상영관으로 가기',ws:'공방으로 들어가기'},pin:'같이 복원해요',first:'금빛 표시를 따라 달항아리 복원 현장으로 가 보세요. 아래 <b>복원 현장</b> 버튼을 눌러도 돼요.',pShort:'쇼츠 보기',pTry:'물레에서 직접 빚기',potterLine:'달항아리는 한 번에 빚기엔 너무 커요. 그래서 반구 둘을 따로 빚어 붙여요. 저 앞 물레에서 해 보세요.',soonLine:'{0} 참여는 곧 열려요. 지금은 옆에서 쇼츠를 보고 작업하는 모습을 구경해 보세요.',soon:'곧 열려요',signWatch:'작업 구경',relicN:{ceramic:'달항아리',science:'측우기',carpenter:'다보탑',painter:'일월오봉도',metal:'금동대향로'},dem:['1. 물레에서 아래 반구를 빚어요','2. 같은 크기로 위 반구를 하나 더','3. 두 반구를 맞붙여요','4. 이음매를 손으로 다듬어요','5. 유약을 입혀 가마에서 구워요'],potStep:'{0} / 4',pot1:'아래 반구 빚기',pot1h:'흙을 손가락으로 끌어서 금빛 선에 맞춰 보세요.',pot2:'위 반구 붙이기',pot2h:'위 반구가 가운데 왔을 때 화면을 눌러 내려놓으세요.',pot3:'이음매 다듬기',pot3h:'화면을 문질러 허리의 이음선을 다듬어요.',pot4:'가마에 굽기',pot4h:'불이 약해요. 장작을 넣어 흰 칸 안에 맞추세요.',fireOk:'좋아요. 이 불을 유지하세요.',fireHot:'불이 너무 세요. 잠깐 기다리세요.',wood:'장작 넣기',stop:'그만하기',joinGood:'딱 맞았어요!',joinOff:'살짝 비뚤어졌어요. 달항아리는 그래서 하나하나 얼굴이 달라요.',pedEmpty:'여기에 내 달항아리가 놓여요',pedMine:'복원단 {0}의 달항아리',afterFix:'복원단이 나머지 자리를 이어서 작업해요. 다른 자리도 도와줄 수 있어요.',afterPot:'내 달항아리가 받침대에 놓였어요. 가마 앞에 앉아 쉬어 가세요.',back:'전시하고 돌아가기',signT:'무이 월드 안내도',signOpen:'지금 열림',moon:{t:'내 달항아리 완성',i:'방금 빚은 것과 같은 방식으로 만든 조선 백자예요. 사진의 항아리는 18세기 후반 작품이고, 지금 뉴욕 메트로폴리탄미술관에 있어요.',f:[['왜 둘로 나눠 빚었을까','한 번에 빚기엔 너무 커서 위아래 반구를 따로 만들어 가운데서 붙였어요. 그래서 허리에 이음선이 보이기도 해요.'],['비뚤어도 괜찮아요','완벽한 원이 아니라 조금씩 다른 둥근 모양이에요. 그래서 달항아리는 하나하나 얼굴이 달라요.'],['그때는 달항아리가 아니었어요','조선시대에는 그냥 큰 항아리, 대호라고 불린 저장 그릇이었어요. 달항아리는 뒤에 붙은 이름이에요.'],['가마가 준 복숭아빛','유약이 가마 안에서 우연히 복숭아색을 띠기도 해요. 당신의 항아리에도 그 빛이 돌아요.']],c:'사진: The Metropolitan Museum of Art, CC0',n:'여기서 빚는 과정은 재미있게 단순화했어요.'}});
Object.assign(STR.en,{wkTitle:'Moon jar restoration site',wkCount:'{0} / 20 spots done',wkAllDone:'Restored! The next jar arrives soon.',wkWait:'The crew is getting ready for the next spot.',wkBtn:'Help out: {0}',wkPick:'First pick the colour closest to the surrounding glaze.',wkWrong:'That stands out. Try another colour.',wkS:[{t:'Survey',how0:'Checking how far each crack runs with a magnifier.',how:'Drag along the crack with the gold dot to mark it.',why:'Before touching anything, record where the crack runs. That lets you compare before and after.',talk:['It forks here','This one is new','Record it first']},{t:'Clean',how0:'Swabbing old dirt out of the crack.',how:'Rub to clean the dirt around the crack.',why:'Swabs with ethanol clean the break. Adhesive will not hold on a dirty surface.',talk:['Pass me another swab','This dirt goes deep','Gently, mind the glaze']},{t:'Bond',how0:'Feeding adhesive into the crack, a little at a time.',how:'Follow the crack slowly to add adhesive.',why:'Paraloid B-72, an acrylic resin, is widely used for ceramics. Even years later it can be dissolved, so the repair can be undone.',talk:['Just a little','See it soak in','Hold your breath']},{t:'Fill',how0:'Filling the cracks and missing pieces.',how:'Follow the crack to add filler.',why:'Missing areas are filled. One recipe mixes resin with fine powders like silica and kaolin, plus pigment.',talk:['Need more paste','This spot is deep','Too thick']},{t:'Level',how0:'Sanding the fill down to the surface.',how:'Rub to level the surface.',why:'Once set, the fill is levelled to match. Only the fill gets sanded, so the original glaze stays unscratched.',talk:['Feel it with your finger','Nearly flush','Still a ridge here']},{t:'Retouch',how0:'Matching the colour and shine of the fill.',how:'Paint the fill to match the surface.',why:'Only the fill is matched to the colour and shine around it. The principle is not to cover the original surface.',talk:['A touch warmer','Leave the original alone','Now you cannot see it']}],fix:{t:'You restored this spot',i:'That is the broad order of real ceramic restoration: survey, clean, bond, fill, level, retouch. The crew is still working on the other spots.',f:[['Why must it be reversible?','If a better method appears, the repair should be redone. So restorers try to choose materials that can be removed later.'],['Why paint only the fill?','A repair must not hide the original. Only the filled area is matched to its surroundings.'],['The trouble with older materials','Epoxy is strong but yellows over time, so researchers keep looking for materials that yellow less.']],c:'Photo: The Metropolitan Museum of Art, CC0',n:'Simplified for the game. Real treatment depends on the object and the conservator.'},title:'MUUI WORLD',sub:'Watch the shorts, make the treasure yourself, rest by the kiln.',g1:'Walk the gallery, watch the shorts, and join the crew working on each treasure beside them.',g2:'Help the crew restore ten treasures in the workshop, and throw your own moon jar.',g3:'Rest by the kiln fire or the pond. Doing nothing is fine here.',g4:'No sign-up. Everyone who opens this link shares the same place.',enter:'Enter the world',pBench:'Restore',market:'MUUI market · soon',pFire:'Kiln fire',pPond:'Pond',pMaru:'Benches',benchTag:'Bench',fp1:'First person (V)',areaN:'Courtyard',go:{pbT:'Portal · Palbok screening hall',pbD:'Get a ticket in the Palbok Art Factory alley and watch the 4-wall D-CUBE work',digT:'Portal · Dig Site',digD:'Dig up treasure pieces in tombs, a sunken ship and a mountain fort',go:'Go',out:'Other areas',inn:'Inside MUUI WORLD',jar:'Moon jar site',bench:'Restore benches',wheel:'Pottery wheel',fire:'Kiln fire',pond:'Pond'},fp3:'Third person (V)',port:{dig:'Enter the Dig Site',palbok:'Go to the Palbok screening hall',ws:'Enter the Workshop'},pin:'Help restore',first:'Follow the gold marker to the moon jar site, or tap <b>Restore</b> below.',pShort:'Watch the short',pTry:'Try the wheel',potterLine:'A moon jar is too big to throw in one go, so we make two halves and join them. Try the wheel over there.',soonLine:'Joining in at {0} opens soon. For now, watch the short and the crew at work.',soon:'Opening soon',signWatch:'Watch',relicN:{ceramic:'Moon jar',science:'Rain gauge',carpenter:'Dabotap',painter:'Sun, Moon, Five Peaks',metal:'Incense burner'},dem:['1. Throw the lower half on the wheel','2. Throw a matching upper half','3. Join the two halves','4. Smooth the seam by hand','5. Glaze it and fire it in the kiln'],potStep:'{0} / 4',pot1:'Throw the lower half',pot1h:'Drag the clay until it matches the gold line.',pot2:'Join the upper half',pot2h:'Tap when the upper half is over the centre.',pot3:'Smooth the seam',pot3h:'Rub the screen to smooth the seam at the waist.',pot4:'Fire the kiln',pot4h:'The fire is low. Add wood to stay in the white band.',fireOk:'Good. Hold this heat.',fireHot:'Too hot. Wait a moment.',wood:'Add wood',stop:'Stop',joinGood:'Dead centre!',joinOff:'A little off. That is why every moon jar has its own face.',pedEmpty:'Your moon jar goes here',pedMine:'Moon jar by Restorer {0}',afterFix:'The crew carries on with the other spots. You can help with another one.',afterPot:'Your jar is on the stand. Sit by the kiln and rest a while.',back:'Display and go back',signT:'MUUI WORLD map',signOpen:'Open now',moon:{t:'Your moon jar is done',i:'A Joseon white porcelain jar, made the same way you just did. The one in the photo is from the second half of the 18th century and is now at The Metropolitan Museum of Art in New York.',f:[['Why two halves?','It was too big to throw in one piece, so the upper and lower halves were made separately and joined. Sometimes the seam still shows at the waist.'],['Off-centre is fine','They are not perfect circles. Each moon jar is round in its own slightly different way.'],['It was not called a moon jar then','In the Joseon era it was simply a large storage jar. The name moon jar came later.'],['A blush from the kiln','The glaze can pick up a peach tint by chance in the kiln. Yours caught that glow too.']],c:'Photo: The Metropolitan Museum of Art, CC0',n:'The making process here is simplified for fun.'}});
Object.assign(STR.ko,{rn:{close:'돌아가기',btn:'직접 재 보기',lot:'직접 재기',line:'비가 오면 관원이 직접 나와서 재요. 측우기 앞으로 가서 해 보세요.',after:'당신의 기록이 장부에 남았어요. 비는 또 올 거예요.',hours:['자시','축시','인시','묘시','진시','사시','오시','미시','신시','유시','술시','해시'],now:'지금은 {0}.',depth:'{0}촌 {1}푼',chonN:'{0}촌',bStart:'비가 온다',bStop:'비가 갰다',bRead:'이 눈금이에요',bSend:'임금께 보고하고 장부에 남기기',noRain:'아직 비가 오지 않아요. 비가 오기 시작할 때 눌러 주세요.',still:'아직 비가 오고 있어요. 그친 뒤에 눌러 주세요.',missed:'때를 놓쳤어요. 다음 비를 다시 지켜봐요.',off:'젖은 자리 끝과 맞지 않아요. 다시 맞춰 보세요.',wrong:'방금 재고 본 내용과 달라요.',up:'바닥에 닿았어요. 이제 위로 끌어 꺼내요.',fA:'비 온 때',fB:'갠 때',fD:'물 깊이',steps:[{t:'비 살피기',how:'비가 오기 시작하면 누르고, 그치면 다시 누르세요.',why:'관원이 직접 비 내리는 모습을 살펴요. 비 오고 갠 때를 함께 적어야 하거든요.'},{t:'주척으로 재기',how:'자를 아래로 끌어 통 바닥에 닿게 하세요.',why:'주척이라는 자를 통 안에 세워 물의 깊이를 재요. 지방 고을에서는 같은 규격의 자를 대나무나 나무로 만들어 뒀어요.'},{t:'눈금 읽기',how:'젖은 자리가 끝나는 곳에 빨간 표시를 맞추세요. 눈금을 눌러도, 화살표를 눌러도 돼요.',why:'자에 젖은 자리까지 읽어요. 물 깊이는 척, 촌, 푼까지 적었어요.'},{t:'기록하고 보고하기',how:'방금 본 대로 칸을 채우세요.',why:'비 오고 갠 일시와 물 깊이를 적어 바로 임금께 보고하고 장부에 남겨요. 뒷날 근거로 삼기 위해서예요.'}],card:{t:'오늘의 비를 기록했어요',i:'당신의 기록: {0}에 비가 와서 {1}에 갰고, 물 깊이는 {2}입니다. 1442년 규정에 적힌 순서대로 해 봤어요.',f:[['관원이 직접 봤어요','서울에서는 서운관 관원이, 지방에서는 수령이 비 내린 상황을 직접 살피고 주척으로 물 깊이를 쟀어요.'],['무엇을 적었을까','비 오고 갠 일시, 그리고 물 깊이의 척 촌 푼을 적어 임금께 보고하고 장부에 남겼어요.'],['지방의 측우기','각 도에 쇠 측우기와 주척을 한 벌씩 보내면, 고을마다 같은 체제로 자기나 질그릇을 구워 객사 뜰의 대 위에 두었어요.'],['지금 전하는 측우기','1837년에 만들어 공주 충청감영에 두었던 금영측우기가 전해요. 세 부분을 이어 만들었고, 높이는 약 32cm예요.']],c:'그림: 무이 유물복원단 쇼츠 장면. 기록: 세종실록 96권, 세종 24년 5월 8일',n:'게임이라 시간을 빠르게 돌리고 단순화했어요. 실록의 분(分)을 여기서는 푼으로 적었어요.'}}});
Object.assign(STR.en,{rn:{close:'Go back',btn:'Measure it yourself',lot:'Try it',line:'When it rains, an official comes out to measure in person. Go to the gauge and try it.',after:'Your record is in the ledger. It will rain again.',hours:['Rat hour','Ox hour','Tiger hour','Rabbit hour','Dragon hour','Snake hour','Horse hour','Goat hour','Monkey hour','Rooster hour','Dog hour','Pig hour'],now:'It is the {0}.',depth:'{0} chon {1} pun',chonN:'{0} chon',bStart:'It is raining',bStop:'It has cleared',bRead:'This mark',bSend:'Report to the king and enter in the ledger',noRain:'No rain yet. Tap when it starts.',still:'It is still raining. Tap after it stops.',missed:'You missed it. Watch the next rain.',off:'That is not where the wet part ends. Try again.',wrong:'That does not match what you just saw.',up:'It touched the bottom. Now drag it up and out.',fA:'Rain began',fB:'Cleared',fD:'Depth',steps:[{t:'Watch the rain',how:'Tap when the rain starts, and again when it stops.',why:'An official watches the rain in person, because the start and end must both be written down.'},{t:'Measure with the ruler',how:'Drag the ruler down until it touches the bottom.',why:'A standard ruler called the jucheok is stood in the vessel to measure the water. County offices made matching rulers of bamboo or wood.'},{t:'Read the mark',how:'Move the red mark to where the wet part ends. Tap the scale or use the arrows.',why:'Read the ruler up to the wet line. Depth was written in cheok, chon and pun.'},{t:'Record and report',how:'Fill in what you just saw.',why:'The date and time of the rain and the depth go straight to the king and into the ledger, as evidence for later.'}],card:{t:'You recorded today\'s rain',i:'Your record: rain began in the {0} and cleared in the {1}, with a depth of {2}. You followed the order written in the rule of 1442.',f:[['Seen in person','In the capital an official of the Seoungwan, in the provinces the magistrate, looked at the rain in person and measured it with the ruler.'],['What was written','The date and time the rain began and cleared, and the depth in cheok, chon and pun, reported to the king and kept in a ledger.'],['Gauges in the provinces','Each province received one iron gauge and one ruler. Counties fired matching vessels in porcelain or earthenware and set them on a stand in the guesthouse yard.'],['The gauge that survives','The Geumyeong gauge, made in 1837 for the Chungcheong provincial office in Gongju, survives. It was made in three joined parts and stands about 32 cm tall.']],c:'Image: MUUI Restoration Crew short. Source: Annals of King Sejong, vol. 96, 1442, 5th month, 8th day',n:'Simplified and sped up for the game.'}}});
Object.assign(STR.ko,{yp:{btn:'{0}폭 함께 그리기',lot:'함께 그리기',line:'지금 그리는 폭을 맡아 보세요. 병풍 앞으로 가면 시작할 수 있어요.',after:'당신이 맡은 폭이 병풍에 들어갔어요. 무이들이 다음 폭을 이어 가요.',pickFirst:'먼저 위에서 색을 고르세요.',pig:[['청','#2a4fa8'],['녹','#2f8a6a'],['홍','#c63f2d'],['백','#f4f1e6']],regions:[{q:'하늘에 맞는 색을 고르세요.',how:'비단의 하늘을 문질러 칠해요.',pig:0,no:'하늘색이 아니에요. 다른 색을 골라 보세요.'},{q:'봉우리에 맞는 색을 고르세요.',how:'봉우리를 문질러 칠해요.',pig:1,no:'봉우리색이 아니에요. 다른 색을 골라 보세요.'},{q:'물결 끝에 맞는 색을 고르세요.',how:'아래 물결을 문질러 칠해요.',pig:3,no:'물결의 흰 물마루 색을 골라 보세요.'}],steps:[{t:'비단 매기',how:'네 곳의 금빛 점을 눌러 비단을 틀에 팽팽하게 당겨요.',why:'비단을 틀에 팽팽하게 매어야 그 위에 고르게 그릴 수 있어요.'},{t:'교반수 칠하기',how:'문질러서 비단 전체에 교반수를 고르게 발라요.',why:'교반수는 아교와 백반을 푼 물이에요. 물감이 비단에 번지지 않게 해요.'},{t:'상초',how:'봉우리 선을 금빛 점을 따라 그으세요.',why:'상초는 초본, 곧 밑그림을 비단 위에 옮겨 그리는 일이에요.'},{t:'채색',how:'색을 고른 뒤 칸을 문질러 칠해요.',why:'광물로 만든 물감을 곱게 만들어 하나하나 올렸어요.'}],card:{t:'{0}번째 폭을 함께 그렸어요',i:'방금 맡은 폭이 병풍에 들어갔어요. 비단을 매고, 교반수를 바르고, 밑그림을 옮기고, 색을 올리는 순서로 작업했어요.',f:[['왕이 있는 곳마다','조선 왕실은 왕의 존재와 권위를 나타내려고 일월오봉도 병풍을 만들어 왕의 공간마다 두었어요.'],['광물로 만든 색','일월오봉병은 광물성 물감으로 그려 화려해요. 물감을 곱게 만들어 하나하나 올리는 일이었어요.'],['가장자리까지 격식','의례용 병풍은 대개 초록색 비단으로 가장자리를 두르고, 그 위에 꽃무늬 금박을 올렸어요.'],['기록에 남은 병풍','정전의 일월오봉도 병풍은 인정전영건도감의궤(1805) 같은 궁궐 건축 의궤에 기록되어 있어요.']],c:'그림: 무이 유물복원단 쇼츠 장면. 참고: 박윤희(2022), 김경운(2006)',n:'순서는 일월오봉병을 옛 방식으로 따라 그린 연구를 참고해 단순화했어요. 실제 궁중 화원의 공정 기록은 아니에요.'}}});
Object.assign(STR.en,{yp:{btn:'Paint panel {0} with the crew',lot:'Paint',line:'Take the panel being painted now. Go up to the screen to start.',after:'Your panel is in the screen. The crew carries on with the next one.',pickFirst:'First pick a colour above.',pig:[['Blue','#2a4fa8'],['Green','#2f8a6a'],['Red','#c63f2d'],['White','#f4f1e6']],regions:[{q:'Pick the colour for the sky.',how:'Rub the silk to paint the sky.',pig:0,no:'Not the sky colour. Try another.'},{q:'Pick the colour for the peaks.',how:'Rub to paint the peaks.',pig:1,no:'Not the peak colour. Try another.'},{q:'Pick the colour for the wave crests.',how:'Rub to paint the waves below.',pig:3,no:'Pick the white of the crests.'}],steps:[{t:'Stretch the silk',how:'Tap the four gold dots to pull the silk taut on the frame.',why:'The silk must be taut on the frame so you can paint evenly.'},{t:'Size the silk',how:'Rub to brush sizing over the whole silk.',why:'Gyobansu is water with hide glue and alum dissolved in it. It stops paint bleeding into the silk.'},{t:'Transfer the drawing',how:'Follow the gold dot along the peaks.',why:'Sangcho means transferring the preparatory drawing onto the silk.'},{t:'Colour',how:'Pick a colour, then rub to paint.',why:'Paints made from minerals were ground fine and applied one by one.'}],card:{t:'You helped paint panel {0}',i:'The panel you took is now in the screen. You stretched the silk, brushed on sizing, transferred the drawing, and laid on colour.',f:[['Wherever the king was','The Joseon court made Sun, Moon and Five Peaks screens to express the king\'s presence and authority, and placed them in the king\'s spaces.'],['Colour from minerals','The screen is painted in mineral paints, which is why it is so brilliant. They were ground fine and applied one by one.'],['Formal to the edges','Ceremonial screens were usually edged in green silk with gold-leaf flower patterns.'],['In the palace records','Throne hall screens are recorded in palace construction records such as the Injeongjeon record of 1805.']],c:'Image: MUUI Restoration Crew short. References: Park Yoonhee (2022), Kim Gyeong-un (2006)',n:'The order is simplified from a study that copied the screen by traditional methods. It is not a record of the court painters\' own procedure.'}}});
Object.assign(STR.ko,{lIn:'해질녘까지 {0}',lOn:'밤 · 해 뜰 때까지 {0}',lMsg0:'<b>해가 졌어요.</b> 마당에 등불이 하나씩 켜져요.',db:{btn:'돌 올려 쌓기',lot:'돌 쌓기',line:'탑은 돌을 짜 맞춰 세워요. 탑 앞으로 가서 직접 올려 보세요.',after:'당신이 쌓은 탑을 무이들이 다시 살펴보고 있어요.',pickT:'다음에 올릴 돌',pickH:'이 층 위에 올라갈 돌을 고르세요.',notYet:'지금 층에 올라갈 돌이 아니에요.',dropH:'돌이 탑 한가운데 왔을 때 화면을 누르세요.',off:'살짝 벗어났어요. 다시 맞춰 보세요.',names:['네 기둥','네모 지붕돌','팔각 몸돌과 난간','팔각 지붕돌','상륜'],why:['돌계단 위에 기둥돌을 세워요. 다보탑은 기둥돌과 지붕돌을 겹쳐 올린 탑이에요.','기둥 위에 네모난 지붕돌을 덮어요. 아래쪽은 네모로 짜여 있어요.','위쪽은 팔각으로 몸돌과 난간을 둘러요. 그래서 층수를 헤아리기 어렵다고 해요.','팔각 지붕돌을 덮어요. 4각, 8각, 원을 한 탑 안에 짜임새 있게 구성했어요.','맨 위에 높은 꼭대기 장식, 상륜을 올려요.'],card:{t:'다보탑을 쌓아 올렸어요',i:'아래는 네모, 위는 팔각, 맨 위는 둥근 장식으로 이어지는 구조를 직접 올려 봤어요.',f:[['사방 돌계단','바닥은 십자 모양을 기본으로 사방에 돌계단을 두었어요.'],['두 탑의 뜻','부처의 설법을 다보불이 옳다고 증명한다는 법화경의 내용을 석가탑과 다보탑 두 탑으로 나타냈어요.'],['사자는 한 마리만','네 모서리에 사자가 있었지만 지금은 한 마리만 남아 있어요.'],['행방을 모르는 것','1925년경 완전히 해체해 보수했는데, 이때 발견되었다는 사리장엄구는 짧은 기록만 있고 행방을 알 수 없어요.']],c:'그림: 무이 유물복원단 쇼츠 장면. 참고: 경주 불국사 다보탑 안내 해설문',n:'게임이라 여러 돌을 층으로 묶어 단순화했어요. 실제 탑은 훨씬 많은 돌로 짜여 있어요.'}},mg:{btn:'확대경으로 살펴보기',lot:'확대경',line:'실제 향로는 높이 61.8cm예요. 확대경으로 가까이 들여다보세요.',after:'확대경 조사가 끝났어요. 무이들이 계속 닦고 있어요.',tg:[{t:'봉황을 찾아요',how:'확대경을 움직여 맨 꼭대기 새에 맞추세요.',why:'봉황이 목과 부리로 여의주를 품고 날개를 펴고 있어요. 앞가슴에도 구멍이 있어 향 연기가 솟아올라요.'},{t:'봉우리 꼭대기 둘레',how:'확대경을 봉황 아래 봉우리 꼭대기로 옮겨요.',why:'뚜껑에는 악기를 연주하는 악사 다섯이 표현되어 있어요. 무인상과 말 탄 사냥꾼도 있어요.'},{t:'산 사이 생명들',how:'겹겹의 산 가운데로 옮겨요.',why:'호랑이, 사슴 같은 동물과 시냇물, 폭포, 호수까지 산 곳곳에 숨어 있어요.'},{t:'연꽃 몸체',how:'가운데 둥근 몸체의 연잎으로 옮겨요.',why:'몸체는 활짝 핀 연꽃을 닮았고, 잎마다 불사조와 물고기, 사슴, 두루미 등이 있어요.'},{t:'받침의 용',how:'몸체를 입으로 문 용의 머리로 옮겨요.',why:'받침은 용 한 마리가 몸체의 연꽃을 입으로 물고 떠받치는 모습이에요.'}],card:{t:'향로를 샅샅이 살펴봤어요',i:'작은 향로 하나에 산과 동물, 악사와 봉황이 다 들어 있어요. 확대경으로 본 것이 전부가 아니에요.',f:[['열두 개의 구멍','봉황의 앞가슴과 뚜껑 곳곳에 구멍 12개가 있어, 향 연기가 산을 감싸고 봉황 앞에서 솟아오르게 만들었어요.'],['어디서 나왔나','1993년 부여 능산리 절터를 발굴하다 나왔어요.'],['산이 입체적이에요','중국 한나라에서 유행한 박산향로의 영향을 받았지만, 산이 입체적이고 동물과 사람이 사실적으로 표현되었어요.'],['실제 크기','높이 61.8cm예요. 그래서 이곳에서도 작게 두고 확대경으로 보게 했어요.']],c:'사진: 국립중앙박물관, 공공누리 제1유형. 참고: 백제금동대향로 안내 해설문',n
