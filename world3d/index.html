  if(a.hidden)for(const P of PORT3){if(Math.hypot(pos.x-P.x,pos.z-P.z)<2.6){a.textContent=`${P.n}로 가기`;actFn=()=>{hint(P.d,3000);setTimeout(()=>{location.href=P.url},700)};a.hidden=false;break}}
  if(a.hidden&&!game)for(const k in GPOS){const g=GPOS[k];if(Math.hypot(pos.x-g.x,pos.z-g.z)<1.9){a.textContent=GV[k].btn+(GBEST[k]!=null?` (최고 ${GBEST[k]}${GV[k].unit})`:'');actFn=()=>startGame(k);a.hidden=false;break}}
  if(game)a.hidden=true;
  if(a.hidden&&!bandWatch){const[wx,wz]=stW(3.4,0);if(Math.hypot(pos.x-wx,pos.z-wz)<3.4){a.textContent=night?'무이 악사 밤 공연 보기':'악사 낮 연습 보기';actFn=openWatch;a.hidden=false}}
  if(a.hidden)for(const S of SPOTS){if(Math.hypot(pos.x-S.x,pos.z-S.z)<S.r){a.textContent=S.t;actFn=()=>hint(S.h,7000);a.hidden=false;break}}
  for(const d of DOORS){const near=Math.hypot(pos.x-d.fx,pos.z-d.fz)<16;if(near&&d.vid.paused)d.vid.play().catch(()=>{});else if(!near&&!d.vid.paused)d.vid.pause()}}
